<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Advisor Harness</title>
<script>
/* Theme before first paint: follow the system setting. */
(function () {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function set() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); }
  set();
  if (mq.addEventListener) { mq.addEventListener('change', set); }
})();
</script>
<style>
/*@@TOKENS@@*/
</style>
<style>
/*@@BUNDLE_CSS@@*/
</style>
<style>
/* ---- The page: layout only. Every colour, size and timing comes from the design system's tokens. ---- */
.fah [hidden] { display: none !important; }
.fah a { color: inherit; }
button.fah-chip { margin: 0; border: 0; background: none; color: inherit; font-family: inherit; cursor: pointer; }
html, body { margin: 0; background: var(--ground); color: var(--ink); }
body { min-height: 100vh; }
.fa-app { --chat-w: clamp(380px, 32vw, 544px); display: grid; grid-template-columns: minmax(0, 1fr) var(--chat-w); height: 100vh; }
.fa-plan { position: relative; min-width: 0; overflow: auto; padding: 20px 20px 0; display: flex; flex-direction: column; scroll-padding-bottom: 64px; }   /* the legend pins to its foot */
.fa-plan > * { flex-shrink: 0; min-width: 0; }
.fa-side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); box-shadow: inset 1px 0 0 var(--line); }

.fa-top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.fa-head { min-width: 0; flex: 1 1 360px; }
.fa-product { margin: 0 0 6px; color: var(--muted); letter-spacing: 0; }
.fa-goal { margin: 0; max-width: 62ch; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.fa-goalmeta { margin: 4px 0 0; color: var(--muted); }
.fa-goalbox { padding-left: 12px; box-shadow: inset 3px 0 0 var(--p); }   /* the goal: principle 1's edge */
.fa-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: flex-end; }
.fa-tools .fah-working { width: 32px; }
.fah-btn[aria-disabled="true"] { cursor: default; }
.fah-btn[aria-disabled="true"]:hover { background: transparent; }
.fah-btn[aria-disabled="true"]:active { transform: none; }
.fa-building { display: inline-flex; align-items: center; gap: 10px; }
.fa-reviewing { font-size: 13px; }

.fa-scroll { overflow-x: auto; overflow-y: visible; margin: 0 -20px; padding: 4px 20px 12px; }
.fa-canvas { position: relative; }
.fa-canvas .fah-step { position: absolute; height: 84px; min-height: 0; }
.fa-canvas .fah-step--from-you { padding-left: 20px; padding-right: 20px; }
.fa-canvas .fah-step--from-you.fah-step--selected, .fa-canvas .fah-step--from-you.fah-step--needs-you { padding-left: 20px; padding-right: 20px; }
.fa-canvas .fah-step__name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.fa-canvas .fah-step__line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fa-canvas .fah-pills { position: absolute; max-width: 184px; flex-wrap: nowrap; overflow: hidden; }   /* the script narrows it with the step */
.fa-canvas .fah-pills .fah-pill { flex: none; }
.fa-canvas .fah-pills .fah-pill:only-child { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.fa-canvas .fah-flow { position: absolute; }
.fa-tag { position: absolute; top: calc(100% + 3px); right: 2px; font-size: 11px; line-height: 14px; font-weight: 400; color: var(--muted); white-space: nowrap; pointer-events: none; }
.fa-tag > span + span { margin-left: 8px; }
.fa-tag [data-p] { color: var(--p-ink); }   /* each mark under a step in its principle's ink */
.fa-markin { display: inline-block; margin-left: 4px; color: var(--p-ink); font-weight: 400; }
.fa-canvas .fah-pop { position: absolute; z-index: 5; max-height: min(70vh, 520px); overflow: auto; }
.fa-canvas .fah-pop > * { flex-shrink: 0; }   /* the pop-up scrolls; its parts keep their height */
.fah-pop .fa-sub, .fah-pop .fa-p { overflow-wrap: anywhere; }

.fa-empty { max-width: 46ch; margin: 48px 0; color: var(--ink-2); }
.fa-empty p { margin: 0 0 8px; }

/* Pop-up contents: one part per principle, each with its edge and its heading in the principle's ink */
.fa-part { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; padding-left: 10px; box-shadow: inset 2px 0 0 var(--p, var(--line)); }
.fa-part > .fa-sec-h:first-child { margin-top: 0; }
.fa-part .fa-sec-h { color: var(--p-ink, var(--ink-2)); }
.fa-sec-h { margin: 8px 0 0; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-2); }
.fa-p { margin: 0; }
.fa-quiet { color: var(--muted); }
.fa-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.fa-list li { display: block; }
.fa-sub { display: block; font-size: 12px; line-height: 16px; color: var(--muted); }
.fa-orig { margin-left: 6px; font-size: 12px; color: var(--muted); }
.fa-orig[data-p], .fa-sub[data-p], .fa-glyph { color: var(--p-ink); }
.fa-orig a, .fa-src a { color: inherit; }
.fa-receipt { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: var(--ground); border-radius: var(--radius-sm); }
.fa-receipt .fah-pop__row > :last-child { color: var(--ink); }
.fa-receipt__out { padding-top: 4px; box-shadow: inset 0 1px 0 var(--line); font-weight: 600; }
.fa-code { margin: 0; max-height: 240px; overflow: auto; padding: 8px 10px; font-size: 12px; line-height: 16px; background: var(--ground); border-radius: var(--radius-sm); white-space: pre; }
.fa-acts { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.fa-ex { display: flex; flex-direction: column; gap: 2px; }
.fa-ex .fa-sub .fah-link { margin-left: 8px; font-size: 12px; color: var(--ink); }
.fah-pop .fah-row .fah-btn { min-height: 36px; padding: 0 12px; }
.fa-tablewrap { overflow-x: auto; }
.fa-table { border-collapse: collapse; font-size: 12px; line-height: 16px; }
.fa-table th { text-align: left; font-weight: 600; color: var(--ink-2); }
.fa-table th, .fa-table td { padding: 2px 12px 2px 0; white-space: nowrap; vertical-align: top; }
.fa-table td { color: var(--ink); }
.fa-rows { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; }
.fa-rows .fah-pop__row { font-weight: 400; font-size: 13px; }
.fa-runs { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; line-height: 16px; }
.fa-runs .fah-link { font-size: 12px; }
.fa-runs .fah-link[aria-current="true"] { font-weight: 600; text-decoration: none; cursor: default; }
.fa-exact summary { font-size: 12px; line-height: 16px; color: var(--muted); cursor: pointer; }
.fa-exact .fa-code { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Whole plan and the Review list */
.fa-section { max-width: 760px; margin-top: 28px; padding-top: 16px; box-shadow: inset 0 1px 0 var(--line); }
.fa-section__head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 0 0 4px; }
.fa-section h3 { margin: 16px 0 6px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-2); }
.fa-section[data-p] { box-shadow: inset 0 2px 0 var(--p); }
.fa-section[data-p] h3 { color: var(--p-ink); }
.fa-reviewing[data-p] { color: var(--p-ink); }
.fa-section ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.fa-rv { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 0; box-shadow: inset 0 -1px 0 var(--line); }
.fa-rv__text { flex: 1 1 260px; min-width: 0; }
.fa-rv .fah-btn { min-height: 36px; padding: 0 12px; }

/* The right-hand panel: the decision history, then the latest exchange, then the box */
.fa-log { position: relative; flex: 1; min-height: 0; overflow: auto; }
.fa-log .fah-msg--you { max-width: 88%; }
.fa-log .fah-msg, .fa-tmsg, .fah-decision__q, .dg-say > span { white-space: pre-line; overflow-wrap: anywhere; }   /* plain text: keep its line breaks; a long figure wraps */
.fa-noanim, .fa-noanim > .fah-thread__body { animation: none !important; }
.fa-muted { color: var(--ink-2); }
.fa-withheld { padding-left: 10px; box-shadow: inset 3px 0 0 var(--p); }
.fa-before[data-p] > summary::before { color: var(--p-ink); }
.fa-meta { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
.fa-working { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.fa-convo { padding: 20px 16px 12px; }
.fa-convo:empty { display: none; }
.fa-before { margin: 14px 16px 0; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.fa-before > summary { display: flex; gap: 8px; align-items: baseline; min-height: 32px; padding: 6px 0; cursor: pointer; list-style: none; }
.fa-before > summary::-webkit-details-marker { display: none; }
.fa-before > summary::before { content: "▸"; display: inline-block; transition: transform var(--dur-base) var(--ease-out); }
.fa-before[open] > summary::before { transform: rotate(90deg); }
.fa-before > .fah-chat { padding: 8px 0 12px; font-size: 14px; line-height: 20px; color: var(--ink); }
.fa-foot { display: flex; flex-direction: column; gap: 14px; margin: 4px 16px 0; padding: 14px 0 12px; box-shadow: inset 0 1px 0 var(--line); }
.fa-foot:empty { display: none; }
.fa-earlier { align-self: flex-start; font-size: 12px; line-height: 16px; color: var(--ink-2); min-height: 32px; }
.fa-loose { display: flex; flex-direction: column; gap: 10px; }
.fa-ans-lead { margin: 0; }
.fah-decision .fah-row .fah-btn, .fah-notice .fah-row .fah-btn { min-height: 36px; padding: 0 12px; }
.fah-notice .dg-facts { margin-top: 2px; }
.dg-facts dt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }   /* a long step name: two lines */
.dg-facts .fa-more { font-size: 12px; line-height: 20px; color: var(--ink-2); }
.fa-compose { padding: 8px 16px 16px; background: var(--surface); }
.fa-compose .fah-composer { flex-wrap: wrap; row-gap: 4px; }
.fa-compose .fah-composer textarea { flex: 1 1 170px; min-width: 0; min-height: 32px; max-height: 160px; padding: 6px 0; font: inherit; line-height: 20px; color: var(--ink); background: transparent; border: 0; outline: 0; resize: none; overflow-y: auto; overflow-wrap: anywhere; }
.fa-compose .fah-composer textarea::placeholder { color: var(--muted); opacity: 1; }
.fa-compose .fah-composer { align-items: flex-end; }
.fa-chiprow { flex: 1 0 100%; min-width: 0; padding-top: 4px; }
.fa-chiprow .fah-chip { max-width: 100%; }
.fa-hint { margin: 0 0 6px; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.fa-hint:empty { display: none; }
.fah-composer .fah-chip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fa-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fa-tag .dg-tag + .dg-tag, .fa-tag > span + .dg-tag, .fa-tag .dg-tag + span { margin-left: 8px; }
.dg-still .fah-msg, .dg-still .dg-node, .dg-still .dg-shape { animation: none; }

/* ---- The principles: a legend at the foot of the plan, and a spotlight ----
   An entry is quiet until something of its principle is on the page. Hovering or focusing an entry spotlights
   its principle (a click pins it; a second click or Escape lets go): the page sets data-spot on .fa-app and
   swaps the neutral and principle tokens for faded copies everywhere except inside [data-p] of that principle. */
.fa-legend { position: sticky; bottom: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 4px;
  margin: auto -20px 0; padding: 8px 20px 10px; background: var(--ground); box-shadow: 0 -1px 0 var(--line); }
.fa-legend__h { margin: 0 8px 0 0; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); }
.fa-key { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px 0 8px; margin: 0;
  font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink); background: none;
  border: 0; border-radius: 16px; cursor: pointer; white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-base) var(--ease-out); }
.fa-key__sw { position: relative; width: 12px; height: 12px; flex: none; border-radius: 3px; background: var(--p); box-shadow: inset 0 0 0 1.5px var(--p-ink);
  transition: background-color var(--dur-base) var(--ease-out); }
.fa-key__n { color: var(--p-ink); }
.fa-key:hover { background: var(--p-tint); }
.fa-key[aria-pressed="true"] { background: var(--p-tint); box-shadow: inset 0 0 0 1.5px var(--p-ink); }
.fa-key.is-off { color: var(--muted); font-weight: 400; }
.fa-key.is-off .fa-key__sw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--p-line); }
.fa-key.is-off .fa-key__n { color: var(--muted); }
@keyframes fa-arrive { from { box-shadow: 0 0 0 0 var(--p); } to { box-shadow: 0 0 0 9px transparent; } }
.fa-key.is-new .fa-key__sw::after { content: ""; position: absolute; inset: 0; border-radius: inherit; animation: fa-arrive 900ms var(--ease-out) 2 both; }
@media (pointer: coarse) { .fa-key { min-height: 44px; } }

.fa-app {
  --full-ink: var(--ink); --full-ink-2: var(--ink-2); --full-muted: var(--muted); --full-line: var(--line); --full-flow: var(--flow);
  --full-bubble: var(--bubble); --full-thread: var(--thread); --full-needs-you: var(--needs-you); --full-tested: var(--tested);
  --dim-ink: color-mix(in srgb, var(--ink) 26%, var(--ground)); --dim-ink-2: color-mix(in srgb, var(--ink-2) 26%, var(--ground));
  --dim-muted: color-mix(in srgb, var(--muted) 26%, var(--ground)); --dim-line: color-mix(in srgb, var(--line) 45%, var(--ground));
  --dim-flow: color-mix(in srgb, var(--flow) 30%, var(--ground)); --dim-bubble: color-mix(in srgb, var(--bubble) 35%, var(--surface));
  --dim-thread: color-mix(in srgb, var(--thread) 35%, var(--surface)); --dim-needs-you: color-mix(in srgb, var(--needs-you) 30%, var(--surface));
  --dim-tested: color-mix(in srgb, var(--tested) 26%, var(--ground));
  --full-p1: var(--principle-1); --full-p1-ink: var(--principle-1-ink); --full-p2: var(--principle-2); --full-p2-ink: var(--principle-2-ink);
  --full-p3: var(--principle-3); --full-p3-ink: var(--principle-3-ink); --full-p4: var(--principle-4); --full-p4-ink: var(--principle-4-ink);
  --full-p5: var(--principle-5); --full-p5-ink: var(--principle-5-ink);
  --dim-p1: color-mix(in srgb, var(--principle-1) 22%, var(--surface)); --dim-p1-ink: color-mix(in srgb, var(--principle-1-ink) 30%, var(--ground));
  --dim-p2: color-mix(in srgb, var(--principle-2) 22%, var(--surface)); --dim-p2-ink: color-mix(in srgb, var(--principle-2-ink) 30%, var(--ground));
  --dim-p3: color-mix(in srgb, var(--principle-3) 22%, var(--surface)); --dim-p3-ink: color-mix(in srgb, var(--principle-3-ink) 30%, var(--ground));
  --dim-p4: color-mix(in srgb, var(--principle-4) 22%, var(--surface)); --dim-p4-ink: color-mix(in srgb, var(--principle-4-ink) 30%, var(--ground));
  --dim-p5: color-mix(in srgb, var(--principle-5) 22%, var(--surface)); --dim-p5-ink: color-mix(in srgb, var(--principle-5-ink) 30%, var(--ground));
}
/* spotlight on: everything fades ... */
.fa-app[data-spot] :is(.fa-plan, .fa-side),
.fa-app[data-spot="1"] [data-p]:not([data-p="1"], .fa-key), .fa-app[data-spot="2"] [data-p]:not([data-p="2"], .fa-key),
.fa-app[data-spot="3"] [data-p]:not([data-p="3"], .fa-key), .fa-app[data-spot="4"] [data-p]:not([data-p="4"], .fa-key),
.fa-app[data-spot="5"] [data-p]:not([data-p="5"], .fa-key) {
  --ink: var(--dim-ink); --ink-2: var(--dim-ink-2); --muted: var(--dim-muted); --line: var(--dim-line); --flow: var(--dim-flow);
  --bubble: var(--dim-bubble); --thread: var(--dim-thread); --needs-you: var(--dim-needs-you); --tested: var(--dim-tested);
}
.fa-app[data-spot] :is(.fa-plan, .fa-side) {
  --principle-1: var(--dim-p1); --principle-1-ink: var(--dim-p1-ink); --principle-2: var(--dim-p2); --principle-2-ink: var(--dim-p2-ink);
  --principle-3: var(--dim-p3); --principle-3-ink: var(--dim-p3-ink); --principle-4: var(--dim-p4); --principle-4-ink: var(--dim-p4-ink);
  --principle-5: var(--dim-p5); --principle-5-ink: var(--dim-p5-ink);
}
/* ... except the spotlit principle's own colour, and the neutral colours inside its elements */
.fa-app[data-spot="1"] :is(.fa-plan, .fa-side) { --principle-1: var(--full-p1); --principle-1-ink: var(--full-p1-ink); }
.fa-app[data-spot="2"] :is(.fa-plan, .fa-side) { --principle-2: var(--full-p2); --principle-2-ink: var(--full-p2-ink); }
.fa-app[data-spot="3"] :is(.fa-plan, .fa-side) { --principle-3: var(--full-p3); --principle-3-ink: var(--full-p3-ink); }
.fa-app[data-spot="4"] :is(.fa-plan, .fa-side) { --principle-4: var(--full-p4); --principle-4-ink: var(--full-p4-ink); --needs-you: var(--full-needs-you); }
.fa-app[data-spot="5"] :is(.fa-plan, .fa-side) { --principle-5: var(--full-p5); --principle-5-ink: var(--full-p5-ink); }
.fa-app[data-spot="1"] [data-p="1"], .fa-app[data-spot="2"] [data-p="2"], .fa-app[data-spot="3"] [data-p="3"],
.fa-app[data-spot="4"] [data-p="4"], .fa-app[data-spot="5"] [data-p="5"], .fa-app[data-spot] .fa-legend {
  --ink: var(--full-ink); --ink-2: var(--full-ink-2); --muted: var(--full-muted); --line: var(--full-line); --flow: var(--full-flow);
  --bubble: var(--full-bubble); --thread: var(--full-thread); --tested: var(--full-tested);
}
.fa-app[data-spot="4"] [data-p]:not(.fa-key) { --needs-you: var(--full-needs-you); }   /* the attention fill is principle 4's, on whatever holds it */
.fa-app[data-spot] .fa-legend {
  --principle-1: var(--full-p1); --principle-1-ink: var(--full-p1-ink); --principle-2: var(--full-p2); --principle-2-ink: var(--full-p2-ink);
  --principle-3: var(--full-p3); --principle-3-ink: var(--full-p3-ink); --principle-4: var(--full-p4); --principle-4-ink: var(--full-p4-ink);
  --principle-5: var(--full-p5); --principle-5-ink: var(--full-p5-ink); --needs-you: var(--full-needs-you);
}
/* text that only inherits its colour picks up the swapped ink where it sits */
:where(.fa-app[data-spot]) :where(.fa-plan, .fa-side, [data-p]) { color: var(--ink); }

@media (max-width: 820px) {
  .fa-app { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
  .fa-side { flex: 1 0 auto; }
  .fa-plan { overflow: visible; padding: 16px 16px 24px; }
  .fa-legend { position: static; margin: 20px -16px 0; padding: 10px 16px; background: none; }   /* in the flow: the fixed message box keeps the foot */
  .fa-scroll { margin: 0 -16px; padding: 4px 16px 12px; }
  .fa-side { box-shadow: inset 0 1px 0 var(--line); padding-bottom: 96px; }
  .fa-log { overflow: visible; }
  .fa-convo { padding: 16px; }
  .fa-compose { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -1px 0 var(--line); }
  .fa-tools { justify-content: flex-start; }
  .fa-canvas .fah-pop { max-width: calc(100vw - 32px); }
}
</style>
</head>
<body>
<div class="fah fa-app" id="app">
  <main class="fa-plan" id="plan" aria-label="The plan">
    <div class="fa-top">
      <div class="fa-head">
        <p class="fah-label fa-product">Financial Advisor Harness</p>
        <div class="fa-goalbox" id="goalbox" data-p="1" hidden>
          <h1 class="fah-title fa-goal" id="goal" hidden></h1>
          <p class="fah-small fa-goalmeta" id="goalmeta" hidden></p>
        </div>
      </div>
      <div class="fa-tools" id="tools"></div>
    </div>
    <div class="fa-empty" id="empty" hidden></div>
    <div class="fa-scroll" id="scroll"><div class="fa-canvas" id="canvas"></div></div>
    <section class="fa-section" id="reviewlist" data-p="5" hidden aria-label="Review"></section>
    <section class="fa-section" id="whole" data-p="1" hidden aria-label="Whole plan"></section>
    <nav class="fa-legend" id="legend" aria-label="The five principles: hover or focus one to see it on the page; click to keep it">
      <p class="fa-legend__h" aria-hidden="true">Principles</p>
      <button class="fa-key" type="button" data-p="1" aria-pressed="false" title="Shared Domain: Agree the plan before any number."><span class="fa-key__sw" aria-hidden="true"></span><span class="fa-key__n">1</span><span>Shared Domain</span><span class="fa-sr">: Agree the plan before any number.</span><span class="fa-sr fa-key__state"></span></button>
