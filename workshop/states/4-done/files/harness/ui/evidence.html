<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show your work</title>
<style>
/* Same three inks as the interview page, used the same way:
   amber = yours (your words, your inputs), violet = the assistant, blue = tested code.
   Red is kept for what has no source. */
:root {
  color-scheme: light dark;
  --paper: #edf2ea;
  --surface: #f9fbf7;
  --raised: #ffffff;
  --line: #c3d0c1;
  --line-soft: #dbe4d8;
  --ink: #10241b;
  --muted: #485c52;
  --you: #7d4a00;
  --you-edge: #b26b00;
  --you-tint: #fff1cf;
  --you-mark: #ffd56b;
  --you-mark-ink: #3b2600;
  --agent: #66298c;
  --agent-tint: #f4e9fb;
  --code: #1a47b8;
  --code-tint: #e3ebff;
  --code-on: #ffffff;
  --ok: #1c6843;
  --bad: #a3231a;
  --bad-tint: #fbe8e5;
  --focus: #1a47b8;
  --aside-bg: #e6ecf1;
  --aside-edge: #52626f;
  --slab: Rockwell, "Rockwell Nova", "Roboto Slab", "DejaVu Serif", "Sitka Text", Georgia, serif;
  --sans: Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --tabs-h: 3.1rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0e1813;
    --surface: #14211a;
    --raised: #1b2b23;
    --line: #34493e;
    --line-soft: #24362c;
    --ink: #e8f0ea;
    --muted: #a6baae;
    --you: #f2c062;
    --you-edge: #e0a83e;
    --you-tint: #33270b;
    --you-mark: #f2c062;
    --you-mark-ink: #241700;
    --agent: #d8adf4;
    --agent-tint: #2c1d39;
    --code: #a3bfff;
    --code-tint: #16254a;
    --code-on: #0b1430;
    --ok: #74d3a0;
    --bad: #ff9f92;
    --bad-tint: #3a1713;
    --focus: #a3bfff;
    --aside-bg: #17212b;
    --aside-edge: #8ea2b3;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
@media (min-width: 1700px) { html { font-size: 19px; } }
@media (min-width: 2300px) { html { font-size: 22px; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.45; }
h1, h2, h3, h4, p, ol, ul, dl, dd, pre, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button, select { font: inherit; color: inherit; }
a { color: var(--code); text-underline-offset: 0.15em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 84rem; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }

#conn {
  position: fixed; left: 50%; top: 0.6rem; transform: translateX(-50%); z-index: 20;
  max-width: min(40rem, calc(100vw - 2rem));
  background: var(--bad); color: var(--paper); padding: 0.5rem 0.9rem; border-radius: 4px; font-weight: 600;
}

/* ---------- head ---------- */
.top { background: var(--surface); border-bottom: 2px solid var(--ink); }
.top .wrap { padding-top: 0.95rem; padding-bottom: 0.85rem; }
.top-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.4rem 1rem; }
.top h1 { font-family: var(--slab); font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.top .thesis { color: var(--muted); max-width: 46rem; margin-top: 0.1rem; }
.brief-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem 0.75rem; margin-top: 0.65rem; padding-top: 0.6rem; border-top: 1px solid var(--line); }
.brief-line .goal { font-family: var(--slab); font-weight: 700; font-size: 1.02rem; line-height: 1.32; max-width: 62rem; overflow-wrap: anywhere; flex: 1 1 22rem; }
.brief-line details.goal { cursor: default; }
.brief-line details.goal summary { list-style: none; }
.brief-line details.goal summary::-webkit-details-marker { display: none; }
@media (max-width: 700px) {
  .brief-line details.goal:not([open]) summary { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; cursor: pointer; }
  .brief-line details.goal summary { cursor: pointer; }
}
.brief-line .goal.none { font-family: var(--sans); font-weight: 400; color: var(--muted); }
.dbline { margin-top: 0.4rem; color: var(--muted); font-size: 0.86rem; }
.dbline code { font-family: var(--mono); color: var(--ink); overflow-wrap: anywhere; }

.tag { display: inline-block; border: 1.5px solid currentColor; border-radius: 3px; padding: 0 0.4rem; font-size: 0.8rem; font-weight: 700; line-height: 1.45; white-space: nowrap; }
.tag.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag.gift { background: var(--you-mark); color: var(--you-mark-ink); border-color: var(--you-mark); }
.tag.warn { color: var(--bad); border-style: dashed; }
.tag.bad { background: var(--bad); color: var(--paper); border-color: var(--bad); }
.tag.ok { color: var(--ok); }
.tag.code { color: var(--code); }
.tag.agent { color: var(--agent); }
.tag.you { color: var(--you); }
.tag.wrap-ok { white-space: normal; }

.btn {
  appearance: none; cursor: pointer; border: 2px solid var(--ink); background: transparent; color: var(--ink);
  padding: 0.5rem 0.95rem; border-radius: 4px; font-weight: 700; line-height: 1.2; text-decoration: none; display: inline-block;
}
.btn:hover { background: var(--line-soft); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--muted); border-color: var(--muted); }
.btn.small { padding: 0.25rem 0.6rem; font-size: 0.88rem; border-width: 1.5px; }
.btn.plain { border-color: transparent; padding: 0.3rem 0.1rem; font-weight: 600; text-decoration: underline; text-underline-offset: 0.2em; }
.btn.plain:hover { background: transparent; color: var(--muted); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn.big { font-size: 1.1rem; padding: 0.7rem 1.3rem; }

/* ---------- tabs ---------- */
#tabs {
  position: sticky; top: 0; z-index: 5; height: var(--tabs-h);
  background: var(--paper); border-bottom: 2px solid var(--ink);
}
#tabs .wrap { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; padding-left: 0.9rem; padding-right: 0.9rem; }
#tabs a {
  flex: none; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; text-decoration: none;
  border-bottom: 5px solid transparent; padding: 0.55rem 0.8rem 0.3rem; font-size: 1rem; font-weight: 600; color: var(--muted);
}
#tabs a:hover { color: var(--ink); }
#tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
#tabs a:focus-visible { outline-offset: -3px; }
#tabs .n { font-variant-numeric: tabular-nums; font-size: 0.82rem; font-weight: 700; min-width: 1.5rem; text-align: center; padding: 0 0.3rem; border-radius: 999px; background: var(--line-soft); color: var(--ink); }
#tabs .n:empty { display: none; }

/* ---------- panel ---------- */
#view { padding-top: 1.2rem; padding-bottom: 4rem; min-height: 60vh; outline: none; }
.lede { color: var(--muted); max-width: 58rem; margin-bottom: 1rem; }
.lede strong { color: var(--ink); }
.empty { border: 2px dashed var(--line); border-radius: 4px; padding: 1.1rem 1.2rem; color: var(--muted); max-width: 46rem; }
.empty code, .lede code, .err code { font-family: var(--mono); font-size: 0.92em; color: var(--ink); background: var(--line-soft); padding: 0 0.3em; border-radius: 3px; }
.err { border-left: 4px solid var(--bad); background: var(--bad-tint); padding: 0.7rem 0.9rem; max-width: 46rem; }
.err .what { font-weight: 700; }
.err .code { color: var(--muted); font-size: 0.9rem; margin-top: 0.15rem; }
.err .btn { margin-top: 0.6rem; }
.loading { color: var(--muted); display: flex; align-items: center; gap: 0.75rem; padding: 1rem 0; }
h2.title { font-family: var(--slab); font-size: 1.45rem; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
h3.sec { font-family: var(--slab); font-size: 1.1rem; font-weight: 700; margin: 2rem 0 0.2rem; }
h3.sec + .sub { color: var(--muted); max-width: 52rem; margin-bottom: 0.6rem; }
.crumb { margin-bottom: 0.5rem; font-size: 0.92rem; }
.crumb a { font-weight: 600; }
.facts { display: flex; flex-wrap: wrap; gap: 0.3rem 1.8rem; margin: 0.5rem 0 0; color: var(--muted); font-size: 0.92rem; }
.facts dt { display: inline; font-weight: 700; }
.facts dd { display: inline; margin-left: 0.3rem; color: var(--ink); overflow-wrap: anywhere; }
.facts > div { min-width: 0; }
.facts code { font-family: var(--mono); font-size: 0.86em; }

/* ---------- the chain: number -> run -> module -> tests ---------- */
.chain { display: grid; grid-template-columns: minmax(0, 1fr) 1.9rem minmax(0, 1fr) 1.9rem minmax(0, 1fr) 1.9rem minmax(0, 1fr); align-items: stretch; margin: 0.9rem 0 0.4rem; }
.chain .wire { position: relative; align-self: center; height: 1.5rem; }
.chain .wire::before { content: ""; position: absolute; left: 0; right: 0.4rem; top: 50%; border-top: 2px solid var(--ink); }
.chain .wire::after { content: ""; position: absolute; right: 0; top: 50%; margin-top: -0.38rem; border: 0.38rem solid transparent; border-right: 0; border-left: 0.6rem solid var(--ink); }
.chain .node {
  display: block; min-width: 0; padding: 0.45rem 0.7rem 0.55rem; background: var(--raised); color: var(--ink);
  border: 2px solid var(--ink); border-top-width: 7px; border-radius: 4px; text-decoration: none;
}
.chain .node .t { display: block; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
.chain .node .v { display: block; font-family: var(--slab); font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.chain .node.k-reply { border-top-color: var(--agent); }
.chain .node.k-module, .chain .node.k-tests { border-top-color: var(--code); }
.chain a.node:hover { background: var(--line-soft); }
.chain .node.here { background: var(--ink); color: var(--paper); }
.chain .node.here .t { color: var(--paper); }
.chain .node.far { border-color: var(--line); border-top-color: var(--line); border-style: dashed; background: transparent; color: var(--muted); }
.chain .node.far .v { font-weight: 400; font-family: var(--sans); }
.chain-note { color: var(--muted); font-size: 0.92rem; margin-bottom: 0.8rem; max-width: 52rem; }
@media (max-width: 800px) {
  .chain { grid-template-columns: minmax(0, 1fr); }
  .chain .wire { height: 1.5rem; width: 1.5rem; transform: rotate(90deg); margin-left: 0.8rem; }
  .chain .node { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 0 0.6rem; align-items: baseline; border-top-width: 2px; border-left-width: 7px; }
  .chain .node.k-reply { border-left-color: var(--agent); }
  .chain .node.k-module, .chain .node.k-tests { border-left-color: var(--code); }
  .chain .node.far { border-left-color: var(--line); }
}

/* ---------- number marks ---------- */
.num { white-space: nowrap; border-radius: 2px; padding: 0 0.14em; color: inherit; text-decoration: none; }
.num .lab {
  display: inline-block; margin-left: 0.28em; padding: 0.1em 0.32em 0.12em; border: 1.5px solid currentColor; border-radius: 2px;
  font-family: var(--sans); font-size: 0.66em; font-weight: 700; line-height: 1; vertical-align: 0.25em; letter-spacing: 0.01em;
}
.num.s-run { color: var(--code); background: var(--code-tint); box-shadow: inset 0 -2px 0 var(--code); font-weight: 600; }
.num.s-run .lab { background: var(--code); color: var(--code-on); border-color: var(--code); }
a.num.s-run:hover { background: var(--code); color: var(--code-on); }
a.num.s-run:hover .lab { background: var(--code-on); color: var(--code); border-color: var(--code-on); }
.num.s-input { color: var(--you); background: var(--you-tint); box-shadow: inset 0 -2px 0 var(--you-edge); }
.num.s-note { color: var(--you); box-shadow: inset 0 -2px 0 var(--you-edge); border-bottom: 0; background: repeating-linear-gradient(90deg, var(--you-tint) 0 6px, transparent 6px 10px); }
.num.s-person { background: var(--you-mark); color: var(--you-mark-ink); }
.num.s-brief { background: var(--line-soft); box-shadow: inset 0 -2px 0 var(--ink); }
.num.s-today { color: var(--muted); box-shadow: inset 0 -2px 0 var(--muted); background: transparent; border-bottom: 0; }
.num.s-small { color: var(--muted); }
.num.s-small .lab { border-color: var(--line); font-weight: 600; }
.num.s-none { background: var(--bad-tint); color: var(--bad); font-weight: 700; outline: 2px solid var(--bad); outline-offset: 0; border-radius: 3px; padding: 0 0.22em; }
.num.s-none .lab { background: var(--bad); color: var(--paper); border-color: var(--bad); }

.legend { background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; padding: 0.2rem 0.9rem 0.8rem; }
.legend summary { cursor: pointer; padding: 0.6rem 0 0.3rem; font-family: var(--slab); font-weight: 700; font-size: 1.02rem; display: flex; align-items: center; gap: 0.5rem; }
.legend summary::before { content: ""; width: 0.5rem; height: 0.5rem; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(-45deg); flex: none; }
.legend[open] summary::before { transform: rotate(45deg); }
.legend dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.55rem 0.8rem; align-items: baseline; margin-top: 0.4rem; }
.legend dt { white-space: nowrap; font-size: 1.05rem; }
.legend dd { font-size: 0.95rem; }
.legend .order { color: var(--muted); font-size: 0.88rem; margin-top: 0.8rem; padding-top: 0.6rem; border-top: 1px solid var(--line); }
.legend .gap { grid-column: 1 / -1; height: 1px; background: var(--line); }

/* ---------- conversations list ---------- */
.rows { border-top: 1px solid var(--line); }
.rows > * { border-bottom: 1px solid var(--line); }
a.rowlink { display: grid; gap: 0.2rem 1.2rem; padding: 0.8rem 0.4rem 0.8rem 0.6rem; color: inherit; text-decoration: none; align-items: start; }
a.rowlink:hover { background: var(--line-soft); }
a.rowlink .chev { flex: none; width: 0.6rem; height: 0.6rem; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(-45deg); margin-top: 0.5rem; justify-self: center; }
a.rowlink:hover .chev { border-color: var(--ink); }
.conv-row { grid-template-columns: 10.5rem minmax(0, 1fr) 1.2rem; }
.conv-row .when { font-weight: 700; }
.conv-row .when small { display: block; font-weight: 400; color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
.conv-row .first { font-family: var(--slab); font-weight: 700; line-height: 1.32; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.stats { display: flex; flex-wrap: wrap; gap: 0.15rem 1.1rem; margin-top: 0.35rem; color: var(--muted); font-size: 0.92rem; align-items: center; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.stats .zero b { color: var(--muted); font-weight: 400; }
.stats .hot b { color: var(--bad); }
@media (max-width: 700px) { .conv-row { grid-template-columns: minmax(0, 1fr) 1.2rem; } .conv-row .when { grid-column: 1; } .conv-row .body { grid-column: 1; } .conv-row .chev { grid-column: 2; grid-row: 1; } }

.run-row { grid-template-columns: 5.5rem 13rem minmax(0, 1fr) 1.2rem; }
.run-row .id { font-family: var(--slab); font-weight: 700; font-size: 1.1rem; }
.run-row .mod { font-weight: 700; color: var(--code); overflow-wrap: anywhere; }
.run-row small { display: block; color: var(--muted); font-weight: 400; font-size: 0.82rem; }
.run-row .out { overflow-wrap: anywhere; }
@media (max-width: 800px) { .run-row { grid-template-columns: 4.2rem minmax(0, 1fr) 1.2rem; } .run-row .out { grid-column: 2; } .run-row .chev { grid-column: 3; grid-row: 1; } }

.mod-row { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr) 1.2rem; }
.mod-row .name { font-family: var(--slab); font-weight: 700; font-size: 1.1rem; color: var(--code); overflow-wrap: anywhere; }
.mod-row .steps { color: var(--muted); font-size: 0.92rem; }
.mod-row .col { display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; align-items: center; }
@media (max-width: 800px) { .mod-row { grid-template-columns: minmax(0, 1fr) 1.2rem; } .mod-row > :not(.chev) { grid-column: 1; } .mod-row .chev { grid-column: 2; grid-row: 1; } }

/* process */
.proc { counter-reset: none; margin-top: 0.4rem; }
.proc li { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr) auto; gap: 0.2rem 0.9rem; padding: 0.55rem 0; align-items: baseline; position: relative; }
.proc .sid { font-family: var(--mono); font-size: 0.88rem; font-weight: 700; overflow-wrap: anywhere; }
.proc .nm { overflow-wrap: anywhere; }
.proc .nm small { color: var(--muted); }
.proc .md { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; justify-content: flex-end; }
.proc .md a { font-weight: 700; }
@media (max-width: 700px) { .proc li { grid-template-columns: minmax(0, 1fr); } .proc .md { justify-content: flex-start; } }
.chip { display: inline-block; border: 1.5px solid var(--ink); background: var(--raised); border-radius: 3px; padding: 0 0.4rem; font-size: 0.85rem; font-weight: 700; line-height: 1.5; white-space: nowrap; margin-right: 0.4rem; }
.chip.k-calculation { border-color: var(--code); color: var(--code); border-width: 2px; }
.chip.k-judgment { border-color: var(--agent); color: var(--agent); border-style: dashed; border-radius: 999px; }
.chip.k-input { border-color: var(--you-edge); color: var(--you); }

/* ---------- conversation ---------- */
.conv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; margin-top: 1rem; }
.conv aside { min-width: 0; order: -1; }
@media (min-width: 1080px) {
  .conv { grid-template-columns: minmax(0, 1fr) 19.5rem; gap: 2.5rem; }
  .conv aside { order: 0; position: sticky; top: calc(var(--tabs-h) + 1rem); align-self: start; }
}
.turns { max-width: 50rem; }
.turn { padding: 0 0 0.2rem 0.85rem; border-left: 4px solid var(--line); margin-bottom: 1.15rem; min-width: 0; }
.turn .who { display: flex; flex-wrap: wrap; gap: 0.15rem 0.6rem; align-items: baseline; font-weight: 700; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.1rem; }
.turn .who time { font-weight: 400; margin-left: auto; font-size: 0.8rem; }
.turn .said { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
.turn.you { border-left-color: var(--you-edge); }
.turn.you .who { color: var(--you); }
.turn.agent { border-left-color: var(--agent); }
.turn.agent .who { color: var(--agent); }
.turn.agent .said { font-size: 1.05rem; }
.turn.held { border-left-style: dashed; border-left-color: var(--bad); }
.turn.held .who { color: var(--bad); }
.turn.held .said { color: var(--muted); background: var(--bad-tint); padding: 0.5rem 0.65rem; border-radius: 3px; line-height: 1.65; }
.turn.sys .who { color: var(--muted); }
.turn.target { background: var(--you-tint); border-radius: 0 4px 4px 0; box-shadow: 0 0 0 0.35rem var(--you-tint); }
.turn .why { margin: 0.2rem 0 0.4rem; }
.turn .why .tag { margin-right: 0.3rem; margin-bottom: 0.2rem; }
.turn .sayline { color: var(--muted); font-size: 0.82rem; font-weight: 700; margin-top: 0.4rem; }
.tally { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.8rem; margin-top: 0.5rem; padding-top: 0.45rem; border-top: 1px dashed var(--line); font-size: 0.9rem; color: var(--muted); }
.tally .num { font-size: 0.95rem; }
.tally .alert { color: var(--bad); font-weight: 700; }
.runcard { border: 2px solid var(--code); border-top-width: 7px; border-radius: 4px; background: var(--raised); padding: 0.5rem 0.8rem 0.7rem; margin-left: -0.1rem; }
.runcard .head { display: flex; flex-wrap: wrap; gap: 0.2rem 0.7rem; align-items: baseline; margin-bottom: 0.3rem; }
.runcard .head b { font-family: var(--slab); font-size: 1.05rem; color: var(--code); overflow-wrap: anywhere; }
.runcard .head .muted { font-size: 0.85rem; }
.runcard .btn { margin-top: 0.55rem; }
.turn .cmp { font-size: 0.95rem; overflow-wrap: anywhere; }
.turn .cmp + .cmp { margin-top: 0.25rem; }
.quote { border-left: 3px solid var(--you-edge); padding-left: 0.6rem; color: var(--you); margin-top: 0.2rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.other { margin-bottom: 0.65rem; padding-left: 0.85rem; border-left: 4px solid var(--line-soft); min-width: 0; }
.other summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 0.1rem 0.6rem; align-items: baseline; color: var(--muted); font-size: 0.88rem; }
.other summary::-webkit-details-marker { display: none; }
.other summary::before { content: "+"; font-family: var(--mono); font-weight: 700; width: 0.8rem; }

/* ---------- gates and decisions (step 4) ---------- */

.running b { display: block; }
.warnbox { border-left: 4px solid var(--bad); background: var(--bad-tint); padding: 0.55rem 0.8rem; margin-top: 0.7rem; max-width: 56rem; }

    if (!sessions.length && !kinds.length) {
      show(...parts, el("div", { class: "empty" }, "Nothing has been recorded yet. Run ", el("code", { text: "python -m harness ask" }), " or ", el("code", { text: "python -m harness build" }), " and every step lands here."));
      return;
    }
    const prefixes = [];
    kinds.forEach((k) => { const i = str(k).indexOf("."); if (i > 0) { const pf = str(k).slice(0, i + 1); if (prefixes.indexOf(pf) < 0) prefixes.push(pf); } });
    const kSel = el("select", { id: "f-kind" }, el("option", { value: "", text: "All kinds" }));
    prefixes.forEach((pf) => kSel.appendChild(el("option", { value: pf, text: "All " + pf + " events" })));
    kinds.forEach((k) => kSel.appendChild(el("option", { value: str(k), text: str(k) })));
    kSel.value = st.ev.kind;
    if (kSel.value !== st.ev.kind) { kSel.appendChild(el("option", { value: st.ev.kind, text: st.ev.kind })); kSel.value = st.ev.kind; }
    const sSel = el("select", { id: "f-session" }, el("option", { value: "", text: "All sessions" }));
    sessions.forEach((x) => sSel.appendChild(el("option", { value: str(x.session_id), text: fmtTime(x.started) + ", " + plural(Number(x.events) || 0, "event") + ", starts with " + str(x.first_kind) + " (" + shortId(x.session_id) + ")" })));
    sSel.value = st.ev.session;
    if (sSel.value !== st.ev.session) { sSel.appendChild(el("option", { value: st.ev.session, text: st.ev.session })); sSel.value = st.ev.session; }
    const filters = el("div", { class: "filters" },
      el("div", null, el("label", { for: "f-kind", text: "Kind" }), kSel),
      el("div", { class: "grow" }, el("label", { for: "f-session", text: "Session" }), sSel));
    const list = el("div", { class: "rows", id: "ev-list" });
    const bar = el("div", { class: "morebar", id: "ev-bar" });
    const apply = () => { st.ev.kind = kSel.value; st.ev.session = sSel.value; loadEvents(true, list, bar); };
    kSel.addEventListener("change", apply);
    sSel.addEventListener("change", apply);
    show(...parts, filters, list, bar);
    await loadEvents(true, list, bar);
  }

  function eventRow(e) {
    const p = e.payload;
    let preview = "";
    try { preview = JSON.stringify(p); } catch (x) { preview = str(p); }
    const d = el("details", null, el("summary", { text: preview.length > 300 ? preview.slice(0, 300) : preview }));
    let filled = false;
    d.addEventListener("toggle", () => { if (d.open && !filled) { filled = true; d.appendChild(el("pre", { class: "raw wrapped", text: pretty(p) })); } });
    const sess = el("button", { class: "btn sess", type: "button", title: "Show only this session", text: str(e.session_id) });
    sess.addEventListener("click", () => {
      const sel = $("f-session");
      if (sel) { if (![...sel.options].some((o) => o.value === str(e.session_id))) sel.appendChild(el("option", { value: str(e.session_id), text: str(e.session_id) })); sel.value = str(e.session_id); sel.dispatchEvent(new Event("change")); window.scrollTo(0, 0); }
    });
    return el("div", { class: "evrow" },
      el("div", { class: "line" },
        el("span", { class: "id", text: "#" + str(e.id) }),
        el("span", { class: "ts" }, timeEl(e.ts)),
        el("span", { class: "kind", text: str(e.kind) }),
        el("span", { class: "meta" }, el("span", null, "actor ", el("b", { text: str(e.actor) })), el("span", null, "session ", sess)),
        d));
  }
  async function loadEvents(fresh, list, bar) {
    const E = st.ev;
    if (E.loading && !fresh) return;
    const my = ++E.token;
    E.loading = true;
    if (fresh) { E.events = []; E.more = false; clear(list); }
    clear(bar);
    bar.appendChild(el("span", { class: "muted", text: "Loading events" }));
    const last = E.events.length ? E.events[E.events.length - 1].id : undefined;
    const r = await api("/api/work/events" + q({ kind: E.kind, session: E.session, before: fresh ? undefined : last }));
    if (my !== E.token || !list.isConnected) { return; }
    E.loading = false; E.loaded = true;
    clear(bar);
    if (!r.ok) { bar.appendChild(errBlock("The events could not be loaded.", r, () => loadEvents(fresh, list, bar))); return; }
    const evs = arr(r.data.events);
    evs.forEach((e) => { E.events.push(e); list.appendChild(eventRow(e)); });
    E.more = r.data.more === true;
    if (!E.events.length) { bar.appendChild(el("div", { class: "empty", text: "No events match these filters." })); return; }
    bar.appendChild(el("span", { text: "Showing " + plural(E.events.length, "event") + ", newest first." }));
    if (E.more) {
      const b = el("button", { class: "btn", type: "button", text: "Load more" });
      b.addEventListener("click", () => { b.disabled = true; loadEvents(false, list, bar); });
      bar.appendChild(b);
    } else bar.appendChild(el("span", { text: "That is all of them." }));
  }

  /* ---------- start ---------- */
  (async function init() {
    show(loadingNode("Loading"));
    const r = await loadSummary();
    if (!r.ok) {
      show(errBlock("The evidence could not be loaded.", r, () => location.reload()));
      return;
    }
    route();
  })();
})();
</script>
</body>
