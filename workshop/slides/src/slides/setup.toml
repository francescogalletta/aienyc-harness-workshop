# Setup and the shape of the session.
group = "Setup"

[[slide]]
id = "s-setup"
name = "Setup"
layout = "setup"
label = "GET THE REPO"
url = "https://github.com/francescogalletta/aienyc-harness-workshop"
needs_label = "YOU NEED ONE OF"
needs = ["Claude Code", "Claude Desktop", "an Anthropic API key", "an OpenRouter API key"]
note = "Or just ask your agent to guide you."

[[slide]]
id = "s-repo"
name = "What you cloned"
layout = "repo"
label = "WHAT YOU JUST CLONED"
items = [
  { path = "workshop/README.md", gloss = "today's guide: start here" },
  { path = "examples/wedding/", gloss = "today's example" },
  { path = "harness/", gloss = "the harness: a core and five layers", mute = 1 },
  { path = "my/", gloss = "your own plan, for later", mute = 1 },
]

[[slide]]
id = "s-map"
name = "The two hours"
layout = "structure"
label = "TODAY'S STRUCTURE"
headline = "For each principle, we explain it, show it working, then you try it."
variant = "stairs"
start = "Setup"
end = "Wrap-up"

[[slide]]
id = "s-fine"
name = "Fine print"
layout = "statement"
blocks = [
  { label = "DISCLAIMER" },
  { display = "Something will break." },
  { sub = "Some of this is over-engineered.", step = 1 },
  { sub = "If something breaks or does not make sense, raise your hand. We will come to you.", step = 2 },
]

[[slide]]
id = "s-check"
name = "Check it works"
layout = "statement"
blocks = [
  { label = "CHECK IT WORKS" },
  { command = "uv run harness check" },
  { sub = "It should end with “Setup works”.", gap = "xs" },
  { command = "uv run harness ui", step = 1, gap = "s" },
  { sub = "The UI opens in your browser.", step = 1, gap = "xs" },
  { label = "OPTIONAL · FOLLOW ALONG WITH THE WEDDING", optional = true, step = 2, gap = "m" },
  { command = "HARNESS_EXAMPLE=wedding uv run harness ui", optional = true, step = 2, gap = "xs" },
]
