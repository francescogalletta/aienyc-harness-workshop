# Why trust, and the framework that earns it.
group = "Why trust"

[[slide]]
id = "s-trust"
name = "Trust"
layout = "centred"
blocks = [
  { label = "THE GOAL IS" },
  { hero = "==Trust.==", step = 1 },
  { sub = "Money is never decided lightly. Not by a company, not by you.", step = 2 },
]

[[slide]]
id = "s-tailored"
name = "Tailored"
layout = "statement"
blocks = [
  { display = "Finance is tailored." },
  { lines = [
      { headline = "Your numbers.", step = 1 },
      { headline = "Your strategy. [Generally none...]{aside step=3}", step = 2 },
      { headline = "Your knowledge. [(or misconceptions)]{aside step=5}", step = 4 },
  ] },
]

[[slide]]
id = "s-evolution"
name = "How the work changed"
layout = "statement"
blocks = [
  { label = "HOW THE WORK CHANGED" },
  { viz = "flow", label = "The work moved from one-shots to prompt engineering, then RAG and tools, then loops and graphs", reveal = "each", node_size = "l", node_width = 340, node_height = 200, nodes = ["One-shots", "Prompt\nengineering", "RAG and\ntools", "Loops and\ngraphs"] },
  { sub = "Agents now take on far more complex work.", step = 5 },
]

[[slide]]
id = "s-interface"
name = "The interface"
layout = "statement"
blocks = [
  { display = "The gap is no longer speed." },
  { sub = "It is how the work meets us.", step = 1 },
  { sub = "So we can ==trust== agents with the highest stakes we have: money.", step = 2 },
]

[[slide]]
id = "s-stakes"
name = "The stakes"
layout = "centred"
blocks = [
  { sub = "Money is not high stakes for you? A one-shot is enough?" },
  { display = "Find me after the workshop.", step = 1 },
  { sub = "[I have some great investment ideas for you.]{aside step=2}" },
]

[[slide]]
id = "s-gap"
name = "The gap"
layout = "split"
left = { label = "YOU", headline = "know your situation", examples = [
  { text = "my bonus lands in March", step = 1 },
  { text = "our client pays late", step = 2 },
  { text = "Q3 had a one-off sale", step = 3 },
  { text = "this CFO guides low", step = 4 },
] }
right = { label = "THE MODEL", headline = "knows the field", step = 5, examples = [
  { text = "the average household", step = 6 },
  { text = "the average company", step = 6 },
  { text = "the average quarter", step = 6 },
] }
foot = { text = "Second nature to you. Averaged out in the training data.", step = 7 }

[[slide]]
id = "s-deal"
name = "The deal"
layout = "statement"
blocks = [
  { display = "Earn the ==trust==." },
  { arrow = "down", step = 1, gap = "s" },
  { display = "Then you can truly delegate the boring work.", step = 1 },
]

[[slide]]
id = "s-not-new"
name = "Not new"
layout = "statement"
blocks = [
  { display = "None of this is new." },
  { lines = [
      { sub = "Unit tests [decades old]{aside step=1}", step = 1 },
      { sub = "Evals [everyone knows]{aside step=2}", step = 2 },
      { sub = "Traces and observability [not new either]{aside step=3}", step = 3 },
      { sub = "Loops and graphs [this season's fashion]{aside step=4}", step = 4 },
      { sub = "Planning with your agent [the most obvious one]{aside step=5}", step = 5 },
  ] },
]

[[slide]]
id = "s-not-tools"
name = "Not tools"
layout = "statement"
blocks = [
  { display = "Not which tools to use." },
  { display = "The design framework that makes them work.", step = 1 },
  { sub = "Closing the distance between knowing it should be done, and knowing WHY.", step = 2 },
]

[[slide]]
id = "s-framework"
name = "The framework (builds bottom-up)"
layout = "framework"
label = "THE GOAL"
goal = "==Trust=="
reveal = true     # one principle per click, from the bottom
confetti = true   # and a burst when the last one lands
