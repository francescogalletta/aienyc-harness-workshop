# Why trust, and the framework that earns it.
group = "Why trust"

[[slide]]
id = "s-trust"
name = "Trust"
layout = "centred"
blocks = [
  { label = "THE GOAL IS" },
  { hero = "==Trust.==", step = 1 },
]

[[slide]]
id = "s-tailored"
name = "Tailored"
layout = "statement"
blocks = [
  { display = "Finance is tailored." },
  { lines = [
      { headline = "Your numbers.", step = 1 },
      { headline = "Your strategy. [Generally none...]{aside step=3}", step = 2 },
      { headline = "Your knowledge. [(or misconceptions)]{aside step=5}", step = 4 },
  ] },
]

[[slide]]
id = "s-interface"
name = "The interface"
layout = "statement"
blocks = [
  { display = "The gap is no longer speed." },
  { sub = "It is how the work meets us.", step = 1 },
  { sub = "So we can ==trust== agents with the highest stakes we have: money.", step = 2 },
]

[[slide]]
id = "s-stakes"
name = "The stakes"
layout = "centred"
blocks = [
  { sub = "Money is not high stakes for you? A one-shot is enough?" },
  { display = "Find me after the workshop.", step = 1 },
  { sub = "[I have some great investment ideas for you.]{aside step=2}" },
]

[[slide]]
id = "s-deal"
name = "The deal"
layout = "statement"
blocks = [
  { display = "Earn the ==trust==." },
  { arrow = "down", step = 1, gap = "s" },
  { display = "Then you can truly delegate the boring work.", step = 1 },
]

[[slide]]
id = "s-not-new"
name = "Ingredients"
layout = "statement"
blocks = [
  { label = "THE INGREDIENTS" },
  { compact = true, lines = [
      { sub = "🔌 Data connections", step = 1 },
      { sub = "🧵 Traces and observability", step = 2 },
      { sub = "🔁 Feedback loops", step = 3 },
      { sub = "🔗 Sources", step = 4 },
      { sub = "🧪 Evals and unit tests", step = 5 },
      { sub = "🧰 Frameworks, SDKs, skills, etc.", step = 6 },
      { sub = "🕸️ Loops and graphs [this season's fashion]{aside step=7}", step = 7 },
  ] },
  { headline = "None of the ingredients are new.", step = 8 },
]

[[slide]]
id = "s-principles"
name = "What we cover"
layout = "statement"
blocks = [
  { label = "TODAY IS ABOUT" },
  { display = "[Design principles]{hook}" },
  { headline = "for a harness that works for money." },
  { lines = [
      { sub = "🚫 No specific technologies.", step = 1 },
      { sub = "🧠 We assume you know the concepts we just listed.", step = 2 },
  ] },
]
marks = [ { target = ".display .hook", kind = "underline" } ]

[[slide]]
id = "s-one-take"
name = "One implementation"
layout = "statement"
blocks = [
  { display = "We want you to feel these principles work." },
  { lines = [
      { sub = "So we built a harness for today, around a very simple example.", step = 1 },
      { sub = "This is just ONE very simple implementation of the principles.", step = 2 },
  ] },
]

[[slide]]
id = "s-taste"
name = "Taste"
layout = "statement"
blocks = [
  { lines = [
      { headline = "🧑‍🍳 We cooked.", step = 1 },
      { headline = "🍽️ You eat.", step = 2 },
      { headline = "📖 Recipes come later. [now you know what good tastes like]{aside who step=4}", step = 3 },
  ] },
]

[[slide]]
id = "s-framework"
name = "The framework (builds bottom-up)"
layout = "framework"
label = "THE GOAL"
goal = "==Trust=="
reveal = true     # one principle per click, from the bottom
confetti = true   # and a burst when the last one lands
