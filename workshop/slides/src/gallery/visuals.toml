# Every viz type, clean and rough. SAMPLE DATA: a wedding fund.

[[slide]]
id = "g-flow-row"
name = "Flow, row, travel"
layout = "statement"
blocks = [
  { label = "FLOW · ROW · CLEAN" },
  { headline = "Principle colours, and a marker that travels" },
  { viz = "flow", label = "The five principles in order, each building on the one before", travel = 1, nodes = [
      { text = "Shared\nDomain", principle = 1 },
      { text = "Consistency", principle = 2 },
      { text = "Evidence", principle = 3 },
      { text = "Accountability", principle = 4 },
      { text = "Verification", principle = 5 },
  ] },
]

[[slide]]
id = "g-flow-row-rough"
name = "Flow, row, rough"
layout = "statement"
blocks = [
  { label = "FLOW · ROW · ROUGH" },
  { headline = "Hand-drawn, one node per click" },
  { viz = "flow", style = "rough", label = "Ask, plan, build, check", reveal = "each", step = 1, nodes = ["Ask", "Plan", { text = "Build", role = "accent" }, "Check"] },
]

[[slide]]
id = "g-flow-column"
name = "Flow, column"
layout = "statement"
blocks = [
  { label = "FLOW · COLUMN · CLEAN" },
  { viz = "flow", direction = "column", node_width = 560, node_height = 116, label = "A question goes through the plan, a tested calculation, and a review", nodes = [
      "Question", { text = "Plan", principle = 1 }, { text = "Tested calculation", principle = 2 }, { text = "Review", principle = 5 }, { text = "Answer", role = "muted" },
  ] },
]

[[slide]]
id = "g-flow-grid"
name = "Flow, branch"
layout = "statement"
blocks = [
  { label = "FLOW · BRANCH · ROUGH" },
  { headline = "Code repeats; the model judges" },
  { viz = "flow", style = "rough", direction = "grid", label = "A question splits into code and model judgement, which join into an answer", links = [[1, 2], [1, 3], [2, 4], [3, 4]], nodes = [
      { text = "Question", at = [1, 2] },
      { text = "Code", at = [2, 1], principle = 2, step = 1 },
      { text = "Model", at = [2, 3], principle = 4, step = 1 },
      { text = "Answer", at = [3, 2], role = "accent", step = 2 },
  ] },
]

[[slide]]
id = "g-bars"
name = "Bars, vertical"
layout = "statement"
blocks = [
  { label = "BARS · VERTICAL · CLEAN · SAMPLE DATA" },
  { headline = "Fund balance after each payment" },
  { viz = "bars", label = "Wedding fund balance after each payment date, lowest on June 10", step = 1, highlight = "Jun 10", highlight_step = 2, max = 20000, ticks = 5000, prefix = "$", values = ["Jun 10", "Sep 30"], data = [["Jan 15", 18200], ["Mar 1", 14700], ["Apr 20", 16900], ["Jun 10", 9800], ["Aug 5", 12300], ["Sep 30", 11400]] },
]

[[slide]]
id = "g-bars-rough"
name = "Bars, vertical, rough"
layout = "statement"
blocks = [
  { label = "BARS · VERTICAL · ROUGH · SAMPLE DATA" },
  { headline = "The same data, hand-drawn" },
  { viz = "bars", style = "rough", label = "Wedding fund balance after each payment date, lowest on June 10", step = 1, highlight = "Jun 10", highlight_step = 2, max = 20000, ticks = 5000, prefix = "$", values = ["Jun 10", "Sep 30"], data = [["Jan 15", 18200], ["Mar 1", 14700], ["Apr 20", 16900], ["Jun 10", 9800], ["Aug 5", 12300], ["Sep 30", 11400]] },
]

[[slide]]
id = "g-bars-h"
name = "Bars, horizontal"
