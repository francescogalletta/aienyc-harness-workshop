[[slide]]
id = "g-count"
name = "Count and marks"
layout = "statement"
blocks = [
  { label = "COUNT · MARK (ROUGH) · SAMPLE DATA" },
  { headline = "Left after the last payment" },
  { viz = "count", label = "Left after the last payment", to = 11400, prefix = "$", step = 1 },
  { sub = "That is the number to protect.", step = 1, gap = "s" },
]
marks = [
  { target = ".viz-count", kind = "underline", style = "rough", step = 2 },
  { target = ".sub", kind = "bracket", style = "rough", step = 3 },
]

[[slide]]
id = "g-marks"
name = "Marks"
layout = "statement"
blocks = [
  { label = "MARK · CLEAN" },
  { display = "[Jun 10]{hook} is the tight spot." },
  { sub = "The balance drops to [$9,800]{hook} before the August gift." },
  { sub = "Annotations draw on at their own click." },
]
marks = [
  { target = ".display .hook", kind = "circle", step = 1 },
  { target = ".sub .hook", kind = "underline", step = 2 },
  { target = ".sub:last-of-type", kind = "box", step = 3, note = "a note goes under its mark" },
]

[[slide]]
id = "g-draw"
name = "Draw-on"
layout = "figure"
label = "DRAW · ANY INLINE SVG STROKES IN AT ITS OWN STEPS"
figure = { viz = "draw", svg = "sample-draw.svg", label = "Three boxes joined by two arrows: input, process, output" }
