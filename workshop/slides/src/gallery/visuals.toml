      { name = "Plan", values = [18000, 17000, 15500, 16000, 15000, 12500, 13000, 13500, 12500], step = 1 },
      { name = "Actual", values = [18200, 16400, 14700, 16900, 14100, 9800, 11100, 12300, 11400], step = 2 },
    ], note = { at = "Jun", text = "tight spot", series = 2, step = 3 } },
]

