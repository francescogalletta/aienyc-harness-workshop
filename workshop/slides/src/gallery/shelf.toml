# The shelf: libraries inlined only when a slide asks for them.

[[slide]]
id = "g-echarts"
name = "ECharts"
layout = "statement"
blocks = [
  { label = "ECHARTS (SHELF) · SAMPLE DATA" },
  { headline = "Money in and out by month" },
  { viz = "echarts", label = "Money in and money out by month, January to September", step = 1, height = 520, option = '''
{
  "legend": { "data": ["In", "Out"] },
  "xAxis": { "type": "category", "data": ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep"] },
  "yAxis": { "type": "value", "max": 12000, "interval": 4000 },
  "series": [
    { "name": "In", "type": "bar", "barWidth": 36, "itemStyle": { "borderRadius": [4, 4, 0, 0] }, "data": [1800, 1800, 1800, 6800, 1800, 1800, 1800, 1800, 1800] },
    { "name": "Out", "type": "bar", "barWidth": 36, "itemStyle": { "borderRadius": [4, 4, 0, 0] }, "data": [3500, 0, 1200, 2400, 0, 10500, 0, 1800, 7200] }
  ]
}
''' },
]

[[slide]]
id = "g-choreo"
name = "anime.js choreography"
layout = "raw"
html = '''
  <p class="label">ANIME.JS (SHELF) · CHOREOGRAPHY ON A CLICK, UNDONE ON THE WAY BACK</p>
  <div class="gal-grid gap-m">
    <div class="gal-cell gal-fly"><span class="pill">Shared Domain</span></div>
    <div class="gal-cell gal-fly"><span class="pill">Consistency</span></div>
    <div class="gal-cell gal-fly"><span class="pill">Evidence</span></div>
    <div class="gal-cell gal-fly"><span class="pill">Accountability</span></div>
    <div class="gal-cell gal-fly"><span class="pill">Verification</span></div>
  </div>
  <p class="hand-note gal-pop gap-l">… and then it all lands.</p>
'''
choreo = [
  { step = 1, targets = ".gal-fly", from = { opacity = 0, translateY = 80 }, to = { opacity = 1, translateY = 0 }, stagger = 90, duration = 700 },
  { step = 2, targets = ".gal-pop", from = { opacity = 0, scale = 0.6 }, to = { opacity = 1, scale = 1 }, duration = 500, ease = "outBack" },
]
