# The deck: its title, the theme deck.html is built with, and the order of sections.
# Each section is a file in slides/ (without .toml); slides run in file order.

title = "Harness You Can Trust"
lang = "en"
theme = "nord"        # default theme: built into deck.html; others go to dist/
palette = "primary"   # "primary": everyone sees the theme's primary palette (D shows the other); "alternate"; "system": the one matching the viewer's light or dark setting
motion = "off"        # "on" brings back slide/step transitions (see styles/base.css)

sections = [
  "opening",
  "about-us",
  "trust",
  "demo",
  "setup",
  "principle-1",
  "principle-2",
  "principle-3",
  "principle-4",
  "principle-5",
  "wrap",
]
