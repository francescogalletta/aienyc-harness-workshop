{# Structure: the session as a flow, start → the principles (from principles.json) → end. #}
  <p class="label">{{ label }}</p>
  <h2 class="headline gap-xs">{{ headline|text }}</h2>
  <div class="flow gap-xl">
    <div class="flow-item"><div class="flow-slot"><span class="flow-node pill">{{ start }}</span></div></div>
{% for p in principles %}
    {% include "parts/arrow-flow.html" %}
    <div class="flow-item grow"><div class="flow-slot"><div class="flow-node step tint" style="--c:var({{ p.color }}); --oc:var({{ p.on }})"><span class="node-emoji" aria-hidden="true">{{ p.emoji }}</span><span class="node-num">{{ p.n }}</span><span class="node-name">{{ p.name }}</span></div></div></div>
{% endfor %}
    {% include "parts/arrow-flow.html" %}
    <div class="flow-item"><div class="flow-slot"><span class="flow-node pill">{{ end }}</span></div></div>
  </div>
