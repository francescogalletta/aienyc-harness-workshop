{# Divider: opens a principle. Everything comes from principles.json. #}
  <div class="p-title"><span class="mega p-num" style="--c:var({{ p.color }}-ink)">{{ p.n }}</span><h1 class="display">{{ p.name }}</h1><span class="p-emoji" aria-hidden="true">{{ p.emoji }}</span></div>
  <p class="sub gap-m">{{ p.statement|text }}</p>
{% if prev %}
  <div class="builds-on gap-l"><span class="cell" style="--c:var({{ prev.color }}); --oc:var({{ prev.on }})">{{ prev.n }}</span><svg class="arrow" viewBox="0 0 64 18"><path class="l" d="M2 9H52" pathLength="100"/><path class="h" d="M50 2l14 7-14 7z"/></svg><p class="sub">{{ p.builds_on|text }}</p></div>
{% endif %}
