# The vocabulary slides are written in: layouts, the blocks a statement slide is
# made of, the rhythm between blocks, and inline markup. build.py reads this;
# templates live next to it (layouts/<template>.html, layouts/blocks/<template>.html).

# ---------------------------------------------------------------------------
# Layouts. `class` is added to the <section>; `fields` are the keys a slide of
# this layout may use (besides id, name, layout, principle, rail); `required`
# must be present. Layouts marked `principle = true` need a principle (set by the
# section file) and get a default id and name from it.
# ---------------------------------------------------------------------------
[layouts.statement]
template = "statement"
fields = ["blocks", "footnote", "aside"]
required = ["blocks"]

[layouts.centred]
template = "statement"
class = "centred"
fields = ["blocks", "footnote", "aside"]
required = ["blocks"]

[layouts.title]
template = "title"
fields = ["kicker", "headline", "byline", "footnote", "aside"]
required = ["kicker", "headline", "byline"]

[layouts.person]
template = "person"
class = "person"
fields = ["person", "photo", "reel"]
required = ["person", "reel"]

[layouts.figure]
template = "figure"
class = "tall"
fields = ["label", "figure"]
required = ["figure"]

[layouts.setup]
template = "setup"
fields = ["label", "url", "needs_label", "needs", "needs_todo", "check_label", "command", "check_result", "note"]
required = ["label", "url", "needs_label", "needs"]   # check_label, command, check_result: optional; note is small and quiet

[layouts.repo]   # the top level of the repository as a file tree: path, gloss, mute = n; then one line (text + command) at its step
template = "repo"
fields = ["label", "items", "line"]
required = ["label", "items"]

[layouts.structure]   # the five modules, each building on the one before; variant picks the picture (one template each)
template = "structure"
variants = { stairs = "structure", layers = "structure-layers", timeline = "structure-timeline" }
default_variant = "stairs"
fields = ["label", "headline", "start", "end", "variant"]
required = ["label", "headline", "start", "end"]

[layouts.split]
template = "split"
fields = ["left", "right", "foot"]   # left/right: label, headline, step, and optional examples = [ { text, step } ] (handwritten, under the headline)
required = ["left", "right"]

[layouts.converge]
template = "converge"
class = "converge"
fields = ["inputs", "question", "sub"]
required = ["inputs", "question"]

[layouts.framework]
template = "framework"
class = "tall"
fields = ["label", "goal", "reveal", "confetti"]
required = ["label", "goal"]

[layouts.divider]
template = "divider"
principle = true
id = "s-p{n}"
name = "Principle {n} · {name}"
fields = ["hide_statement"]   # hide_statement = true drops the statement line under the name

[layouts.placeholder]
template = "placeholder"
principle = true
id = "s-p{n}-{kind}"
name = "P{n} · {kind_name}"
fields = ["kind", "label"]
required = ["kind"]

[layouts.raw]   # escape hatch: bespoke markup, used as is (a hand-written <figure class="viz" …> works here too)
template = "raw"
fields = ["html", "class"]
required = ["html"]

# Used by the gallery (src/gallery/): colour swatches and type specimens read live from the theme.
[layouts.swatches]
template = "swatches"
fields = ["label", "headline", "tokens"]
required = ["label", "tokens"]

[layouts.typescale]
template = "typescale"
fields = ["label", "rows", "row"]
required = ["label", "rows"]

# Every layout also takes an optional slide-level list, drawn by the visuals kit:
#   marks = [ { target = ".hands .num:last-child", kind = "circle", step = 5 } ]   underline, circle, bracket, box

# Placeholder kinds: what the dashed panel says, and whether it has the rounded
# "from you" shape.
[kinds.demo]
label = "DEMO"
kind_name = "Demo"

[kinds.turn]
label = "YOUR TURN"
kind_name = "Your turn"
from_you = true

[kinds.content]
label = "WHY · WITHOUT IT · EXAMPLES"
kind_name = "Why / without it / examples"

# ---------------------------------------------------------------------------
# Blocks: statement slides list them in `blocks = [ ... ]`, top to bottom, e.g.
#   { label = "WHY" }, { display = "…" }, { sub = "…", step = 1 }
# The first key that names a role decides the block. `tag = "heading"` means
# <h1> for the first heading on the slide and <p> after it. Optional keys on any
# block: step, out, mute (build steps), gap (override the rhythm: xs s m l xl).
# ---------------------------------------------------------------------------
[roles]
label    = { tag = "p", class = "label" }
display  = { tag = "heading", class = "display", template = "display" }   # + cycle = [...] to swap the end of the line, + quiet = true
headline = { tag = "h2", class = "headline" }
sub      = { tag = "p", class = "sub" }
command  = { tag = "code", class = "mono step command xl" }               # a shell command, large
mega     = { tag = "heading", class = "mega", template = "mega" }         # + emoji = "…" or chip = "…" beside it
hero     = { tag = "heading", class = "mega xl" }                         # one huge word
ask      = { tag = "p", class = "display step from-you ask" }
who      = { tag = "p", class = "hand-aside ask-who" }                    # handwritten line below the ask, outside its oval
lines    = { class = "stack-tight", template = "lines" }                  # [ { headline = "…", step = 1 }, … ]; or soft
tally    = { class = "hands", template = "tally" }                        # numbers that appear one by one, the previous one muting; + grow = true makes each larger than the last
tracks   = { class = "tracks", template = "tracks" }
guesses  = { class = "says", template = "guesses" }                       # + heads = ["YOU SAY", "…"]
grid     = { class = "steps-grid", template = "grid" }
arrow    = { class = "arrow-down", template = "arrow" }                   # a small down arrow between two blocks: arrow = "down"
viz      = { class = "viz" }                                              # a chart, diagram or animation: see "Visuals" below

# Roles allowed inside `lines`.
[line_roles]
headline = "headline"
soft = "soft"
sub = "sub"          # smaller: five lines under a display

# Modifiers: a block key that adds a class.
[modifiers]
quiet = "quiet"
grow = "grow"
compact = "compact"   # on guesses: a smaller table for long quotes
optional = "optional" # follow along with the wedding example if you like: a dashed tag (label) or box (command)

# Gap before a block, by "previous-role role". Anything not listed gets default.
[rhythm]
default = "m"
"label headline" = "xs"
"label display" = "s"
"label mega" = "s"
"label tally" = "xs"
"ask who" = "xs"
"headline sub" = "xs"
"sub sub" = "s"
"sub label" = "xl"
"display lines" = "l"
"display label" = "l"
"hero sub" = "l"
"lines sub" = "l"
"tally sub" = "l"
"guesses sub" = "l"
"headline viz" = "l"

# ---------------------------------------------------------------------------
# Inline markup inside any text:
#   ==Trust==                      the trust accent
#   [text]{aside step=1}           a span with roles and build steps
# Roles below map to classes; keys step/out/mute/strike/fill become data-step-*.
# ---------------------------------------------------------------------------
[inline]
accent = "trust"       # also what ==text== means
aside = "hand-aside"    # handwritten aside that pops in
who = "ask-who"         # with aside: the speaker, on its own line
lead = "lead"           # the strong first word of a soft line
emo = "emo"             # an emoji inside handwriting
stress = "ask-us"       # big underlined word
hook = "hook"           # no look of its own: a handle for marks (target = ".hook")
lookname = "look-name"  # the current look's name, kept up to date in a --looks build

# ---------------------------------------------------------------------------
# Visuals: { viz = "<type>", label = "what it shows", … } as a block, or as the
# figure of a figure slide. Types: flow, bars, waterfall, line, timeline, count,
# draw. Any of them: step (when the data appears), style = "rough",
# animate = false. build.py checks the keys; README "Add a chart" has examples.
# ---------------------------------------------------------------------------
