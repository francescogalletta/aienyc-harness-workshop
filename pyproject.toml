[project]
name = "finance-harness-workshop"
version = "0.0.0"
description = "A small agent harness for personal finance work, built one design principle at a time."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]      # only for the `anthropic` provider

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false             # run from the repository root; nothing to build

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so plain `pytest` finds the harness package too
