[project]
name = "finance-harness-workshop"
version = "0.0.0"
description = "A small agent harness for personal finance work, built one design principle at a time."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harness = "harness.__main__:main"   # `uv run harness ...`, same as `python -m harness ...`

[project.optional-dependencies]
claude = ["anthropic"]      # only for the `anthropic` provider

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harness"
module-root = ""            # the package sits at the repository root, not under src/

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so plain `pytest` finds the harness package too
