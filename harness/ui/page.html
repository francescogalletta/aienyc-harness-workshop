<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Advisor Harness</title>
<script>
/* Theme before first paint: follow the system setting. */
(function () {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function set() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); }
  set();
  if (mq.addEventListener) { mq.addEventListener('change', set); }
})();
</script>
<style>
/* Financial Advisor Harness: tokens. The CSS form of tokens.json, kept in step with it by hand (there is no generator):
   change tokens.json first, then the same line here. tests/layer0/test_page.py checks the two agree. */
:root, [data-theme="light"] {
  --ground: #eef2f7;
  --surface: #ffffff;
  --ink: #0f2440;
  --ink-2: #33465f;
  --muted: #4f6078;
  --line: #bccadb;
  --flow: #6f84a0;
  --needs-you: #edd0c7;
  --tested: #85617f;
  --thread: #dde6f2;
  --bubble: #dfe6ef;
  --principle-1: #81a1c1;
  --principle-1-ink: #51708e;
  --principle-2: #b690af;
  --principle-2-ink: #85617f;
  --principle-3: #ab4f59;
  --principle-3-ink: #ab4f59;
  --principle-4: #d38a73;
  --principle-4-ink: #9f5b45;
  --principle-5: #a3be8c;
  --principle-5-ink: #5c7446;
  --on-principle: #0f2440;
  --on-principle-3: #ffffff;
  --principle-tint: 12%;
  --on-ink: #ffffff;
  --shadow-pop: 0 6px 20px rgba(15,36,64,0.16);
}
[data-theme="dark"] {
  --ground: #0c1524;
  --surface: #14213a;
  --ink: #e8eef7;
  --ink-2: #c3cfdf;
  --muted: #9db0c8;
  --line: #2e4466;
  --flow: #5f7898;
  --needs-you: #644d52;
  --tested: #b690af;
  --thread: #1b2c4a;
  --bubble: #223556;
  --principle-1: #81a1c1;
  --principle-1-ink: #81a1c1;
  --principle-2: #b690af;
  --principle-2-ink: #b690af;
  --principle-3: #ab4f59;
  --principle-3-ink: #cd6d76;
  --principle-4: #d38a73;
  --principle-4-ink: #d38a73;
  --principle-5: #a3be8c;
  --principle-5-ink: #a3be8c;
  --on-principle: #0f2440;
  --on-principle-3: #ffffff;
  --principle-tint: 18%;
  --on-ink: #0c1524;
  --shadow-pop: 0 6px 20px rgba(0,0,0,0.5);
  color-scheme: dark;
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-step-you: 36px;
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 360ms;
  --dur-draw: 500ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
.fah-title { font-family: var(--font-sans); font-size: 22px; line-height: 28px; font-weight: 600; }
.fah-question { font-family: var(--font-sans); font-size: 16px; line-height: 22px; font-weight: 600; }
.fah-step-name { font-family: var(--font-sans); font-size: 15px; line-height: 20px; font-weight: 600; }
.fah-body { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 400; }
.fah-small { font-family: var(--font-sans); font-size: 13px; line-height: 18px; font-weight: 400; }
.fah-label { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; }
.fah-pill { font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 400; }
</style>
<style>
/* Financial Advisor Harness: component styles. Load tokens.css first.
   Every class is prefixed fah-. Wrap a screen in .fah once. No dependencies. */

.fah, .fah *, .fah *::before, .fah *::after { box-sizing: border-box; }
.fah {
  font-family: var(--font-sans, "IBM Plex Sans", "Segoe UI", system-ui, sans-serif);
  font-size: 14px; line-height: 20px; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.fah :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

@keyframes fah-rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fah-pop { from { opacity: 0; transform: scale(0.97) translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes fah-draw { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
@keyframes fah-flow { from { stroke-dashoffset: 10; } to { stroke-dashoffset: -100; } }
@keyframes fah-ring { from { box-shadow: 0 0 0 0 var(--needs-you); } to { box-shadow: 0 0 0 12px rgba(0, 0, 0, 0); } }
@keyframes fah-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

/* ---- Principle colour ----
   Colour says which of the five principles (one per harness layer) produced an element.
   data-p="1".."5" on an element sets, for it and what it holds:
   --p the principle's fill, --p-ink its small text, marks and thin strokes, --p-tint a faint container ground,
   --p-line a quiet outline, --p-on text on the fill, --p-hover the fill under the pointer.
   Components read these with a neutral fallback, so without data-p nothing changes.
   One rule everywhere: a container takes the tint and a 3px edge in the fill; a mark, tag or label takes the ink;
   an outline takes the ink; a primary button takes the fill. Body text stays ink. */
[data-p="1"] { --p: var(--principle-1); --p-ink: var(--principle-1-ink); --p-on: var(--on-principle); }
[data-p="2"] { --p: var(--principle-2); --p-ink: var(--principle-2-ink); --p-on: var(--on-principle); }
[data-p="3"] { --p: var(--principle-3); --p-ink: var(--principle-3-ink); --p-on: var(--on-principle-3); }
[data-p="4"] { --p: var(--principle-4); --p-ink: var(--principle-4-ink); --p-on: var(--on-principle); }
[data-p="5"] { --p: var(--principle-5); --p-ink: var(--principle-5-ink); --p-on: var(--on-principle); }
[data-p] {
  --p-tint: color-mix(in srgb, var(--p) var(--principle-tint), var(--surface));
  --p-line: color-mix(in srgb, var(--p-ink) 55%, var(--surface));
  --p-hover: color-mix(in srgb, var(--p) 80%, var(--on-principle-3));
}
[data-p="3"] { --p-hover: color-mix(in srgb, var(--p) 85%, var(--on-principle)); }

/* ---- Step ---- */
.fah-step {
  position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  width: 184px; min-height: 72px; padding: 8px 12px; margin: 0;
  font: inherit; text-align: left; color: var(--ink); background: var(--surface);
  border: 0; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1.5px var(--p-ink, var(--ink));
  cursor: pointer;
  transition: box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-base) var(--ease-out),
    color var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.fah-step:hover { transform: translateY(-1px); box-shadow: inset 0 0 0 1.5px var(--p-ink, var(--ink)), var(--shadow-pop); }
.fah-step:active { transform: scale(0.99); }
.fah-step--from-you { border-radius: var(--radius-step-you); }
.fah-step--your-call { box-shadow: none; border: 1.5px dashed var(--p-ink, var(--ink)); padding: 6.5px 10.5px; }
.fah-step--your-call:hover { box-shadow: var(--shadow-pop); }
.fah-step--selected, .fah-step--selected:hover { box-shadow: inset 0 0 0 3px var(--ink); }
.fah-step--your-call.fah-step--selected, .fah-step--your-call.fah-step--needs-you { box-shadow: none; border-width: 3px; padding: 5px 9px; }
.fah-step--needs-you { background: var(--needs-you); }
.fah-step--needs-you::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  animation: fah-ring 700ms var(--ease-out) 1 both;
}
.fah-step--faded { color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.fah-step--faded.fah-step--your-call { box-shadow: none; border-color: var(--line); }
.fah-step__name { font-size: 15px; line-height: 20px; font-weight: 600; }
.fah-step__line { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.fah-step__line[data-p] { color: var(--p-ink); }   /* the line says what its principle found: built, tested, decided, challenged */
.fah-step__line--strong { font-weight: 600; color: var(--ink); }
.fah-step__line--strong[data-p] { color: var(--ink); }   /* on the attention fill: ink */
.fah-step__line--result { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink); }
.fah-step__line--result[data-p] { color: var(--ink); text-decoration: underline 2px var(--p); text-underline-offset: 4px; }   /* a figure that leads back, as in the chat */
.fah-step--faded .fah-step__line { color: var(--muted); }
.fah-step__tick {
  display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px;
  fill: none; stroke: var(--p-ink, var(--tested)); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 16; stroke-dashoffset: 0;
}
.fah-step.is-arriving .fah-step__line { animation: fah-rise var(--dur-slow) var(--ease-out) both; }
.fah-step.is-arriving .fah-step__tick { animation: fah-draw var(--dur-draw) var(--ease-out) both; }

/* ---- Pill (an input) ---- */
.fah-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.fah-pill {
  display: inline-flex; padding: 4px 8px; font-size: 11px; line-height: 14px; white-space: nowrap;
  color: var(--ink-2); background: var(--surface); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
}
:where(.fah-pills[data-p]) > .fah-pill, .fah-pill:where([data-p]) { box-shadow: inset 0 0 0 1px var(--p-line); }
.fah-pill--used { color: var(--ink); box-shadow: inset 0 0 0 1px var(--p-ink, var(--ink)); }

/* ---- Flow (a line or arrow between steps) ---- */
.fah-flow { display: block; overflow: visible; fill: none; stroke: var(--flow); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fah-flow__head { fill: var(--flow); stroke: none; }
.fah-flow__pulse { stroke: var(--p-ink, var(--ink)); stroke-dasharray: 10 100; stroke-dashoffset: 10; opacity: 0; }
.fah-flow.is-flowing .fah-flow__pulse { opacity: 1; animation: fah-flow var(--dur-draw) var(--ease-in-out) both; }

/* ---- Button, Toggle ---- */
.fah-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; margin: 0;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: transparent;
  border: 0; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1.5px var(--p-ink, var(--ink)); cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.fah-btn:hover { background: var(--p-tint, var(--bubble)); }
.fah-btn:active { transform: scale(0.98); }
.fah-btn--primary, .fah-btn[aria-pressed="true"] { color: var(--p-on, var(--on-ink)); background: var(--p, var(--ink)); box-shadow: none; }
.fah-btn--primary:hover, .fah-btn[aria-pressed="true"]:hover { background: var(--p-hover, var(--ink-2)); }
.fah-btn--block { display: flex; width: 100%; justify-content: flex-start; text-align: left; padding: 10px 12px; }
.fah-link { padding: 0; margin: 0; font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.fah-link[data-p] { color: var(--p-ink); }
.fah-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---- Chat ---- */
.fah-chat { display: flex; flex-direction: column; gap: 14px; }
.fah-msg { margin: 0; animation: fah-rise var(--dur-base) var(--ease-out) both; }
.fah-msg--you { align-self: flex-end; max-width: 280px; padding: 10px 12px; background: var(--bubble); border-radius: 10px; }
.fah-chip { display: inline-block; padding: 0 6px; font-size: 12px; line-height: 16px; font-weight: 600; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1.5px var(--ink); }
.fah-msg--you .fah-chip { display: table; margin-bottom: 6px; }
.fah-num { padding: 0 1px; font-weight: 600; border-bottom: 2px solid var(--p, var(--ink)); border-radius: 2px 2px 0 0; cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
.fah-num:hover, .fah-num.is-traced { background: var(--p-tint, var(--thread)); }
.fah-working { position: relative; width: 48px; height: 2px; overflow: hidden; background: var(--line); border-radius: 1px; }
.fah-working::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--p-ink, var(--ink)); animation: fah-slide 1.1s var(--ease-in-out) infinite; }

/* ---- Thread (a side question or a reviewer challenge) ---- */
.fah-thread { font-size: 13px; line-height: 18px; background: var(--thread); border-radius: var(--radius-lg); }
.fah-thread > summary { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; font-weight: 600; cursor: pointer; list-style: none; border-radius: var(--radius-lg); }
.fah-thread > summary::-webkit-details-marker { display: none; }
.fah-thread > summary::before { content: "▸"; display: inline-block; transition: transform var(--dur-base) var(--ease-out); }
.fah-thread[open] > summary::before { transform: rotate(90deg); }
.fah-thread__meta { font-weight: 400; color: var(--ink-2); }
.fah-thread__body { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; font-size: 14px; line-height: 20px; }
.fah-thread[open] > .fah-thread__body { animation: fah-rise var(--dur-base) var(--ease-out) both; }
.fah-thread__source { font-size: 12px; color: var(--ink-2); }

/* ---- Decision (a call that is the person's) ---- */
.fah-decision { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--p-tint, var(--surface)); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 2px var(--p-ink, var(--ink)); animation: fah-rise var(--dur-base) var(--ease-out) both; }
.fah-decision__q { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; }
.fah-decision__why { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-2); }

/* ---- Notice (something ran on an unconfirmed assumption) ---- */
.fah-notice { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--p-tint, transparent); border: 1.5px dashed var(--p-ink, var(--flow)); border-radius: var(--radius-lg); animation: fah-rise var(--dur-base) var(--ease-out) both; }

/* ---- Composer (the message box) ---- */
.fah-composer { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1.5px var(--ink); transition: box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-base) var(--ease-out); }
.fah-composer:focus-within { box-shadow: inset 0 0 0 2.5px var(--ink); }
.fah-composer--side { background: var(--p-tint, var(--thread)); }
.fah-composer input { flex: 1; min-width: 0; padding: 0; font: inherit; color: var(--ink); background: transparent; border: 0; outline: 0; }
.fah-composer input::placeholder { color: var(--muted); opacity: 1; }
.fah-side { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0; font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; white-space: nowrap; }
.fah-side::after { content: ""; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--p-ink, var(--muted)); transition: background-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
.fah-side[aria-pressed="true"] { color: var(--ink); }
.fah-side[aria-pressed="true"]::after { background: var(--p, var(--ink)); box-shadow: inset 0 0 0 1.5px var(--p-ink, var(--ink)); }

/* ---- Popover (a step's detail) ---- */
.fah-pop { display: flex; flex-direction: column; gap: 6px; width: 336px; padding: 14px 16px; font-size: 13px; line-height: 18px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1.5px var(--ink), var(--shadow-pop); transform-origin: top left; animation: fah-pop var(--dur-base) var(--ease-out) both; }
.fah-pop__head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; line-height: 20px; font-weight: 600; }
.fah-pop__row { display: flex; justify-content: space-between; gap: 12px; }
.fah-pop__row > :last-child { color: var(--muted); }
.fah-pop__row--you > :last-child { color: var(--ink); font-weight: 600; }
.fah-pop__foot { display: flex; gap: 16px; margin-top: 6px; color: var(--ink-2); }

/* =====================================================================
   Decision graph (dg-): the history beside the plan. Same tokens; colour is the principle (data-p).
   Contributors are told apart by shape, never by colour; selection is an outline;
   the attention colour marks only what waits on the person.
   ===================================================================== */
.dg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes dg-pop { from { transform: scale(0); } to { transform: none; } }
@keyframes dg-draw { to { stroke-dashoffset: 0; } }

/* ---- Contributor mark: circle you, diamond assistant, square harness, triangle reviewer ---- */
.dg-who { display: inline-block; flex: none; width: 12px; height: 12px; overflow: visible; vertical-align: -1px; }
.dg-shape { fill: var(--ink); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.dg-shape--open { fill: var(--surface); stroke: var(--ink-2); }
.dg-shape--dead { fill: var(--surface); stroke: var(--muted); }
.dg-shape--needs { fill: var(--needs-you); stroke: var(--ink); stroke-width: 1.75; }
.dg-shape[data-p] { fill: var(--p); stroke: var(--p-ink); }   /* a decision on the trunk, filled with the principle that made it */
.dg-shape--open[data-p] { fill: var(--surface); stroke: var(--p-ink); }
.dg-shape--dead[data-p] { fill: var(--surface); stroke: var(--muted); }
.dg-shape--needs[data-p] { fill: var(--needs-you); stroke: var(--ink); }
.dg-shape.is-new { transform-box: fill-box; transform-origin: center; animation: dg-pop var(--dur-base) var(--ease-out) var(--dur-draw) both; }

/* ---- History: rows of a spine. Decisions on the left, branches on the right ---- */
.dg-graph { position: relative; padding: 18px 14px 6px; }
.dg-svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.dg-l { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dg-l--trunk { stroke: var(--ink); stroke-width: 2.5; }
.dg-l--branch { stroke: var(--flow); stroke-width: 1.75; }
.dg-l--dead { stroke: var(--flow); stroke-width: 1.5; stroke-dasharray: 1 4; opacity: 0.8; }
.dg-l--cap { stroke: var(--muted); stroke-width: 1.75; }
.dg-l--sel { fill: none; stroke: var(--ink); stroke-width: 2; }
.dg-l.is-drawing { stroke-dasharray: 100; stroke-dashoffset: 100; animation: dg-draw var(--dur-draw) var(--ease-out) forwards; }
.dg-row { display: grid; grid-template-columns: minmax(0, 0.8fr) 40px minmax(0, 1.2fr); align-items: start; padding: 5px 0; }
.dg-row__l, .dg-row__s, .dg-row__r { grid-row: 1; min-width: 0; }
.dg-row__l { grid-column: 1; }
.dg-row__s { grid-column: 2; }
.dg-row__r { grid-column: 3; padding-left: 14px; }
.dg-row--trunk .dg-node { align-items: flex-end; text-align: right; }
.dg-row--trunk .dg-node__meta, .dg-row--trunk .dg-node__results { justify-content: flex-end; }
.dg-now { display: block; text-align: right; font-size: 12px; line-height: 16px; color: var(--muted); }
.dg-graph--narrow .dg-row { grid-template-columns: 30px minmax(0, 1fr); }
.dg-graph--narrow .dg-row__s { grid-column: 1; }
.dg-graph--narrow .dg-row__l, .dg-graph--narrow .dg-row__r { grid-column: 2; }
.dg-graph--narrow .dg-row--trunk .dg-node { align-items: flex-start; text-align: left; }
.dg-graph--narrow .dg-row--trunk .dg-node__meta, .dg-graph--narrow .dg-row--trunk .dg-node__results { justify-content: flex-start; }
.dg-graph--narrow .dg-row__r { padding-left: 22px; }
.dg-graph--narrow .dg-now { text-align: left; }

/* ---- Trunk node: one confirmed decision ---- */
.dg-node { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dg-node__title { margin: 0; padding: 0; font: inherit; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--ink); text-align: inherit;
  background: none; border: 0; border-radius: var(--radius-sm); cursor: pointer; overflow-wrap: anywhere; }
.dg-node__title:hover { text-decoration: underline; text-underline-offset: 3px; }
.dg-node__meta { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center; font-size: 12px; line-height: 20px; color: var(--ink-2); }
.dg-node__results { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

   swaps the neutral and principle tokens for faded copies everywhere except inside [data-p] of that principle. */
.fa-legend { position: sticky; bottom: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 4px;
  margin: auto -20px 0; padding: 8px 20px 10px; background: var(--ground); box-shadow: 0 -1px 0 var(--line); }

  font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink); background: none;
  border: 0; border-radius: 16px; cursor: pointer; white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-base) var(--ease-out); }
.fa-key__sw { position: relative; width: 12px; height: 12px; flex: none; border-radius: 3px; background: var(--p); box-shadow: inset 0 0 0 1.5px var(--p-ink);
  transition: background-color var(--dur-base) var(--ease-out); }
.fa-key__n { color: var(--p-ink); }
.fa-key:hover { background: var(--p-tint); }
.fa-key[aria-pressed="true"] { background: var(--p-tint); box-shadow: inset 0 0 0 1.5px var(--p-ink); }

.fa-key.is-off .fa-key__sw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--p-line); }
.fa-key.is-off .fa-key__n { color: var(--muted); }

.fa-key.is-new .fa-key__sw::after { content: ""; position: absolute; inset: 0; border-radius: inherit; animation: fa-arrive 900ms var(--ease-out) 2 both; }

        <button class="fah-side" type="button" id="sidebtn" data-p="4" aria-pressed="false" hidden>New branch</button>
      </div>
    </div>
  </section>
</div>
<script>

     kind: undefined | 'tested' | 'result' | 'strong'. text is put in as text, never HTML. */
  function setLine(step, text, kind) {
    var line = step.querySelector('.fah-step__line');
    if (!text) {

    }

      line = document.createElement('span');

    line.className = 'fah-step__line' + (kind === 'result' ? ' fah-step__line--result' : kind === 'strong' ? ' fah-step__line--strong' : '');
    line.textContent = '';

    if (num) { num.classList.add('is-traced'); }

  }

     square the harness, triangle the reviewer. One function, so a mark in text and a node
     on the trunk are the same path at different sizes. */
  var WHO = { you: 'You', assistant: 'The assistant', harness: 'The harness', reviewer: 'The reviewer' };
  function shape(who, x, y, r) {

    if (who === 'harness') { var q = r * 0.9; return 'M' + (x - q) + ' ' + (y - q) + 'h' + (2 * q) + 'v' + (2 * q) + 'h' + (-2 * q) + 'z'; }

    return 'M' + (x - r) + ' ' + y + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0z';
  }

  function mark(who, state, size) {

    flow: flow, trace: trace, sideToggle: sideToggle, restart: restart, wait: wait,
    shape: shape, mark: mark, join: join
  };
})();

    var sp = rel(graphRows[0].el.querySelector('.dg-row__s'), box), X = Math.round(sp.x + sp.w / 2);
    var trunkY = {}, firstY = null, nowY = 0, marks = [], out = {};
    graphRows.forEach(function (r) {
      if (r.kind === 'trunk') { trunkY[r.id] = rel(r.anchor, box).y + 10; if (firstY == null) { firstY = trunkY[r.id]; } }
      if (r.kind === 'now') { nowY = rel(r.anchor, box).y + 8; }
    });
    if (firstY == null) { firstY = 12; }
    path('M' + X + ' ' + firstY + 'V' + nowY, 'dg-l--trunk');
    path('M' + (X - 6) + ' ' + nowY + 'H' + (X + 6), 'dg-l--trunk');
    graphRows.forEach(function (r) {
      if (r.kind === 'trunk') { marks.push([r.n.who, X, trunkY[r.id], null, 7, anim === r.id, NODE_P[r.n.kind]]); return; }
      if (r.kind !== 'branch' && r.kind !== 'draft') { return; }
      var t = r.t, oc = t ? outcome(t) : 'open', dead = oc === 'dead';
      var det = r.el.querySelector('details'), card = rel(det, box);
      var x1 = Math.round(card.x - 11), by = rel(r.anchor, box).y + 10, line = dead ? 'dg-l--dead' : 'dg-l--branch';
      path('M' + X + ' ' + (by - 18) + 'C' + X + ' ' + (by - 6) + ' ' + x1 + ' ' + (by - 14) + ' ' + x1 + ' ' + (by - 5), line);
      var ey = by, prop = null;
      if (det.open) {
        prop = r.el.querySelector('.dg-propose');
        var last = prop || r.el.querySelector('.dg-branch__body > :last-child');
        if (last) { ey = rel(last, box).y + (prop ? 20 : 9); }
      }
      if (ey > by + 6) { path('M' + x1 + ' ' + (by + 5) + 'V' + ey, line); }
      if (oc === 'joined' && trunkY[t.node] != null && trunkY[t.node] > ey) {
        var jy = trunkY[t.node];
        var jl = path('M' + x1 + ' ' + ey + 'V' + Math.max(ey, jy - 24) + 'C' + x1 + ' ' + (jy - 10) + ' ' + X + ' ' + (jy - 18) + ' ' + X + ' ' + (jy - 8), 'dg-l--branch', anim === t.node);
        if (anim === t.node) { out.line = jl; }
      }
      if (dead) { path('M' + x1 + ' ' + (ey + 6) + 'V' + (ey + 16), 'dg-l--dead'); path('M' + (x1 - 5) + ' ' + (ey + 17) + 'H' + (x1 + 5), 'dg-l--cap'); }
      marks.push([t ? opener(t) : 'you', x1, by, dead ? 'dead' : 'open', 5.5, false, t ? threadP(t) : 4]);
      if (t && prop && pendingOf(t)) { marks.push(['harness', x1, ey, decisionWaits() ? 'open' : 'needs', 6, false, 4]); }
    });
    if (ui.markNode && trunkY[ui.markNode] != null) { svg.appendChild(svgEl('circle', { class: 'dg-l dg-l--sel', cx: X, cy: trunkY[ui.markNode], r: 12 })); }
    marks.forEach(function (m) {
      var p = P(svgEl('path', { d: F.shape(m[0], m[1], m[2], m[4]), class: 'dg-shape' + (m[3] ? ' dg-shape--' + m[3] : '') }), m[6]);
      svg.appendChild(p);
      if (m[5]) { out.mark = p; }
    });
    return out;
  }

  /* ---------- the whole panel, drawn from the state ---------- */
  function workingThread(list) {
    if (!(S.lanes && S.lanes.side === 'working')) { return null; }
    var a = arr(S.activity).filter(function (x) { return x.lane === 'side' && x.thread; })[0];
    if (a) { return a.thread; }
    var w = null;
    list.forEach(function (t) { var ms = arr(t.messages); if (ms.length && ms[ms.length - 1].who === 'you') { w = t.id; } });
    return w;
  }
  function tailNodes() {
    var out = [];
    if (S.lanes && S.lanes.main === 'working') {
      var a = arr(S.activity).filter(function (x) { return x.lane === 'main'; })[0];
      var s = a && a.step ? stepById(a.step) : null;
      var w = el('div', 'fa-working'), bar = el('div', 'fah-working');
      var text = (s ? label(s) + ': ' : '') + ((a && a.text) || 'Working');
      bar.setAttribute('role', 'status'); bar.setAttribute('aria-label', text);
      add(w, bar, text); out.push(w);
    }
    if (S.phase === 'interview' && S.waiting && S.waiting.kind === 'message') {
      out.push(add(el('div'), linkBtn('Propose the plan now', function () { act('wrap'); })));
    }
    if (S.error) { out.push(el('p', 'fah-msg fa-muted fa-noanim', 'That did not finish: ' + S.error)); }
    return out;
  }
  function drawPanel(force) {
    var T = trunk(), chat = arr(S.chat), list = arr(threads());
    var sig = JSON.stringify([S.chat, S.history, S.threads, S.activity, S.lanes, S.waiting, S.phase, S.layers, S.error, S.inputs,
      steps().map(function (s) { return [s.id, s.number, s.name, s.kind, (s.runs || []).length]; }), ui.draft, ui.showEarlier]);
    if (sig === panelSig && !force) { return; }
    panelSig = sig;
    var log = $('log'), stick = first || nearBottom(), top = log.scrollTop;
    var ae = document.activeElement, focusKey = ui.focusKey || (ae && ae.getAttribute && ae.getAttribute('data-key')), caret = ae && ae.selectionStart;
    ui.focusKey = null;

    /* a side message that opened a new branch: open it and keep typing there */
    if (ui.knownThreads && ui.wantNewThread) {
      list.forEach(function (t) { if (!ui.knownThreads[t.id]) { ui.branchOpen[t.id] = true; ui.openThread = t.id; ui.wantNewThread = false; focusKey = 'reply:' + t.id; } });
    }
    ui.knownThreads = {}; list.forEach(function (t) { ui.knownThreads[t.id] = true; });

    var lastPlan = -1; chat.forEach(function (m, i) { if (m.kind === 'plan') { lastPlan = i; } });
    var waitingPlan = S.waiting && S.waiting.kind === 'plan';
    var fresh = [], firstDraw = seenMsgs === null; seenMsgs = seenMsgs || {};
    function render(m, holder) {
      var i = chat.indexOf(m);
      messageNodes(m, { acceptHere: i === lastPlan && waitingPlan }).forEach(function (n) {
        if (firstDraw || seenMsgs[m.id]) { n.classList.add('fa-noanim'); }
        holder.appendChild(n);
      });
      if (!seenMsgs[m.id] && !firstDraw) { fresh.push(m); }
      seenMsgs[m.id] = true;
    }
    var workingIn = workingThread(list), lastOpenSide = null;
    list.forEach(function (t) { if (t.kind === 'side' && outcome(t) === 'open') { lastOpenSide = t.id; } });
    function ctxOf(t) {
      var oc = outcome(t);
      return { working: workingIn === t.id, defaultOpen: oc === 'open' && (!!pendingOf(t) || workingIn === t.id || t.id === ui.openThread || t.id === lastOpenSide) };
    }

    var before = $('before'), bmsgs = $('beforemsgs'), graph = $('graph'), convo = $('convo'), foot = $('foot');
    bmsgs.textContent = ''; convo.textContent = ''; foot.textContent = '';
    if (graphRO) { graphRO.disconnect(); graphRO = null; }

    if (!T.length) {
      /* no decision yet (before "Plan accepted", or a layer that records none): a plain conversation,
         with any branch right after the message it follows */
      show(before, false); show(graph, false); graphRows = []; graph.textContent = '';
      var lastAt = {};
      chat.forEach(function (m) { var h = el('div', 'fah-chat'); render(m, h); convo.appendChild(h); lastAt[m.id] = h; });
      list.forEach(function (t) {
        var b = add(el('div', 'fa-loose'), branchEl(t, ctxOf(t)));
        var host = t.after && lastAt[t.after];
        if (host) { host.after(b); lastAt[t.after] = b; } else { convo.appendChild(b); }
      });
      if (ui.draft) { convo.appendChild(add(el('div', 'fa-loose'), draftEl())); }
      var tl = tailNodes(); if (tl.length) { var tw = el('div', 'fah-chat'); tl.forEach(function (n) { tw.appendChild(n); }); convo.appendChild(tw); }
      Array.prototype.forEach.call(convo.children, function (c, i) { if (i) { c.style.marginTop = '14px'; } });
    } else {
      var cut = T[0].after ? chat.map(function (m) { return m.id; }).indexOf(T[0].after) : -1;
      var pre = chat.slice(0, cut + 1);
      var joinMsgs = {};
      T.forEach(function (n) { var jm = joinMessageOf(n.id); if (jm && jm.who === 'harness') { joinMsgs[jm.id] = true; } });
      var post = chat.slice(cut + 1).filter(function (m) { return !joinMsgs[m.id]; });
      /* the interview, folded: the trunk starts at "Plan accepted" */
      show(before, pre.length > 0);
      $('beforesum').textContent = 'How the plan was made · ' + pre.length + (pre.length === 1 ? ' message' : ' messages');
      pre.forEach(function (m) { render(m, bmsgs); });
      /* the graph */
      show(graph, true);
      buildGraph(graph, T, list, ctxOf);
      /* the foot: the latest exchange; anything still waiting on the person stays in it */
      var start = -1;
      post.forEach(function (m, i) { if (m.who === 'you') { start = i; } });
      if (start < 0) { start = 0; }
      post.forEach(function (m, i) {
        var waits = (m.decision && m.decision.status === 'open') || (m.notice && m.notice.status === 'open');
        if (i < start && waits && layerOn(4)) { start = i; }
      });
      if (start <= 2) { start = 0; }      /* fold only when there is something to fold */
      var earlier = post.slice(0, start), latest = post.slice(start);
      if (earlier.length) {
        var lk = linkBtn(ui.showEarlier ? 'Hide earlier messages' : 'Earlier in the chat · ' + earlier.length, function () { ui.showEarlier = !ui.showEarlier; drawPanel(true); });
        lk.classList.add('fa-earlier'); lk.setAttribute('aria-expanded', String(ui.showEarlier)); foot.appendChild(lk);
        if (ui.showEarlier) { earlier.forEach(function (m) { render(m, foot); }); }
        else { earlier.forEach(function (m) { seenMsgs[m.id] = true; }); }
      }
      latest.forEach(function (m) { render(m, foot); });
      tailNodes().forEach(function (n) { foot.appendChild(n); });
    }
    if (fresh.length) { var lm = fresh[fresh.length - 1]; $('live').textContent = (WHO[lm.who] || '') + ': ' + (lm.text || ''); }

    /* keep what the person was doing */
    if (focusKey) {
      var f = document.querySelector('[data-key="' + focusKey + '"]');
      if (f) { f.focus({ preventScroll: true }); if (typeof caret === 'number' && f.value) { try { f.setSelectionRange(caret, caret); } catch (e) { /* not a text field */ } } }
    }
    if (stick) { toBottom(); } else { log.scrollTop = top; }
    /* on load, a proposal that waits for a yes is what the person came back to: show it, not the foot */
    if (firstDraw) { var waits = graph.querySelector('.dg-branch--needs'); if (waits) { waits.scrollIntoView({ block: 'nearest' }); } }
    var j = joinAnim; joinAnim = null;
    var drawn = drawGraph(j);
    if (j) {
      var card = graph.querySelector('[data-node="' + j + '"]');
      var focusIt = !ae || ae === document.body || log.contains(ae) || !document.contains(ae);
      if (card) { card.scrollIntoView({ block: 'nearest', behavior: smooth() }); }
      F.join({ line: drawn.line, mark: drawn.mark, card: card, tags: ui.joinTags || [], focus: focusIt && card ? card.querySelector('.dg-node__title') : null });
      ui.joinTags = [];
    } else { graph.classList.add('dg-still'); }
    if (j) { graph.classList.remove('dg-still'); }
    if (!graph.hidden && window.ResizeObserver) {
      var firstObs = true;
      graphRO = new ResizeObserver(function () { if (firstObs) { firstObs = false; return; } drawGraph(null); });
      graphRO.observe(graph);
    }
  }
  function nearBottom() { var l = $('log'); return l.scrollHeight - l.scrollTop - l.clientHeight < 80; }
  function toBottom() { var l = $('log'); if (l.scrollHeight > l.clientHeight) { l.scrollTop = l.scrollHeight; } }
  /* A branch that was open is joined now: the next draw plays the join (motion.md). */
  function detectJoin() {
    arr(threads()).forEach(function (t) {
      var oc = outcome(t);
      if (!first && prevOutcome[t.id] && prevOutcome[t.id] !== 'joined' && oc === 'joined' && t.node) { joinAnim = t.node; }
      if (prevOutcome[t.id] === 'open' && oc !== 'open') { delete ui.branchOpen[t.id]; if (ui.openThread === t.id) { ui.openThread = null; } }   /* ended: fold it */
      prevOutcome[t.id] = oc;
    });
  }

  /* ---------- the composer at the foot: the main conversation, or a new branch ---------- */
  function setSide(on) {
    ui.side = !!on;
    sideBtn.setAttribute('aria-pressed', String(ui.side));
    composer.classList.toggle('fah-composer--side', ui.side);
    P(composer, ui.side ? 4 : null);
  }
  function drawComposer() {
    var canSide = !!S && layerOn(4);
    show(sideBtn, canSide);
    if (!canSide && ui.side) { setSide(false); }
    var old = composer.querySelector('.fa-chiprow'); if (old) { old.remove(); }
    var text = null, aria = '';
    if (ui.attached && stepById(ui.attached)) { text = label(stepById(ui.attached)); aria = 'Remove step ' + text; }
    else { ui.attached = null; ui.notice = null; }
    if (text) {
      var c = el('button', 'fah-chip', text + ' ✕'); c.type = 'button'; c.setAttribute('aria-label', aria);
      c.addEventListener('click', function () { ui.attached = null; ui.notice = null; drawComposer(); input.focus(); });
      composer.insertBefore(add(el('div', 'fa-chiprow'), c), input);
    }
    composer.classList.toggle('fa-has-chip', !!text);
    var ph, decisionOpen = S && S.waiting && S.waiting.kind === 'decision';
    if (ui.notice) { ph = 'Say what is different…'; }
    else if (ui.side) { ph = ui.attached ? 'Start a branch about this…' : 'Start a branch…'; }
    else if (decisionOpen) { ph = '…or answer in your own words'; }
    else if (ui.attached) { ph = 'Say what should change…'; }
    else if (!S || S.phase === 'empty' || !steps().length) { ph = S && S.phase === 'interview' ? 'Answer, or add anything…' : 'Say what you want to plan…'; }
    else { ph = 'Ask, or click a step…'; }
    input.placeholder = ph;
    input.setAttribute('aria-label', ui.side ? 'Start a branch' : ui.attached ? 'Message about step ' + label(stepById(ui.attached)) : 'Message');
  }
  function send() {
    var text = input.value.trim(); if (!text) { return; }
    var p;
    if (ui.side) {
      var body = { text: text, subject: ui.attached ? { kind: 'step', step: ui.attached } : { kind: 'plan' } };
      if (ui.attached) { body.step = ui.attached; }
      ui.wantNewThread = true; p = act('side', body);
    } else {
      var b2 = { text: text }; if (ui.attached) { b2.step = ui.attached; } if (ui.notice) { b2.notice = ui.notice; }
      p = act('say', b2);
    }
    input.value = ''; fit();
    p.then(function (ok) {
      if (!ok) { if (!input.value) { input.value = text; fit(); } return; }
      ui.attached = null; ui.notice = null; setSide(false); drawComposer();
      if (ui.selected && !ui.pop) { F.select(null, document); ui.selected = null; }   /* the step went with the message */
    });
  }
  /* The message box grows with what is typed, up to its max-height, then scrolls. */
  function fit() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
  input.addEventListener('input', fit);
  input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); send(); } });
  sideBtn.addEventListener('click', function () { var on = F.sideToggle(sideBtn); ui.side = on; P(composer, on ? 4 : null); drawComposer(); input.focus(); });

  /* ---------- empty plan ---------- */
  function drawEmpty() {
    var e = $('empty'), none = !steps().length;
    show(e, none); show(scroller, !none); e.textContent = '';
    if (!none) { return; }
    if (S.phase === 'interview') { e.appendChild(el('p', null, 'The assistant is asking what it needs. The plan appears here as steps once it has enough.')); }
    else if (S.phase === 'proposed' || S.phase === 'accepted') { e.appendChild(el('p', null, 'The plan has no steps yet.')); }
    else { e.appendChild(el('p', null, 'Say in the chat what you want to plan. The plan appears here as steps you can check, build and ask about.')); }
  }

  /* ---------- one draw from the state document ---------- */
  function draw() {
    try {
      detectJoin();
      drawTop();
      drawEmpty();
      drawDiagram();
      drawWhole();
      drawReviewList();
      drawPanel();
      drawComposer();
      if (ui.pop) { refreshPop(); }
      if (first) {
        var ny = steps().filter(function (s) { return s.needs_you; })[0];
        if (ny && stepEls[ny.id]) { scroller.scrollLeft = Math.max(0, lay.pos[ny.id].x - 40); }
      }
    } catch (err) {
      if (window.console) { console.error(err); }
    }
    first = false;
  }

  /* ---------- the legend: which principle is on the page, and a spotlight on one ---------- */
  var app = $('app'), keys = Array.prototype.slice.call(document.querySelectorAll('.fa-key'));
  var spot = { pin: null, hover: null }, everOn = {}, legendInit = false, legendQueued = false;
  function applySpot() {
    var n = spot.hover || spot.pin;
    if (n) { app.setAttribute('data-spot', n); } else { app.removeAttribute('data-spot'); }
    keys.forEach(function (k) { k.setAttribute('aria-pressed', String(k.getAttribute('data-p') === spot.pin)); });
  }
  /* An entry is on while an element of its principle shows (the moving pulse along a line does not count). */
  function updateLegend() {
    legendQueued = false;
    var on = {};
    Array.prototype.forEach.call(app.querySelectorAll('[data-p]'), function (n) {
      var k = n.getAttribute('data-p');
      if (on[k] || n.classList.contains('fa-key') || n.classList.contains('fah-flow__pulse')) { return; }
      if (n === sideBtn && n.getAttribute('aria-pressed') !== 'true') { return; }   /* the toggle alone is not principle 4 at work */
      if (n.getClientRects().length) { on[k] = true; }
    });
    var quietly = !legendInit; legendInit = !!S;
    keys.forEach(function (k) {
      var n = k.getAttribute('data-p'), isOn = !!on[n];
      if (k.classList.contains('is-off') === isOn || !k.querySelector('.fa-key__state').textContent) {
        k.classList.toggle('is-off', !isOn);
        k.querySelector('.fa-key__state').textContent = isOn ? ' On the page.' : ' Not on the page yet.';
      }
      if (isOn && !everOn[n]) { everOn[n] = true; if (!quietly) { F.restart(k, 'is-new'); } }
    });
  }
  function queueLegend() { if (!legendQueued) { legendQueued = true; requestAnimationFrame(updateLegend); } }
  if (window.MutationObserver) {
    new MutationObserver(function (list) {
      if (list.some(function (m) { return !m.target.closest || !m.target.closest('#legend'); })) { queueLegend(); }
    }).observe(app, { subtree: true, childList: true, attributes: true, attributeFilter: ['hidden', 'open', 'data-p', 'aria-pressed'] });
  }
  keys.forEach(function (k) {
    var n = k.getAttribute('data-p');
    k.addEventListener('mouseenter', function () { spot.hover = n; applySpot(); });
    k.addEventListener('mouseleave', function () { if (spot.hover === n && document.activeElement !== k) { spot.hover = null; applySpot(); } });
    k.addEventListener('focus', function () { spot.hover = n; applySpot(); });
    k.addEventListener('blur', function () { if (spot.hover === n) { spot.hover = null; applySpot(); } });
    k.addEventListener('click', function () { spot.pin = spot.pin === n ? null : n; if (!spot.pin) { spot.hover = null; } applySpot(); });
  });
  queueLegend();

  /* ---------- page-level keys and clicks ---------- */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && (spot.pin || spot.hover) && (!ui.pop || (ev.target.closest && ev.target.closest('#legend')))) { ev.preventDefault(); spot.pin = null; spot.hover = null; applySpot(); }
    else if (ev.key === 'Escape' && ui.pop) { ev.preventDefault(); closePop(true); }
    else if (ev.key === 'Escape' && (ui.selInput || ui.markNode)) { ui.selInput = null; ui.markNode = null; markPills(); drawDiagram(); markNodeSel(); }
  });
  document.addEventListener('click', function (ev) {
    if (ui.pop && popEl && !popEl.contains(ev.target)) { closePop(false); }
  });
  var resizeTimer = null;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (S) { drawDiagram(); placePop(); drawGraph(null); } }, 120); });

  drawComposer();
  poll();
})();
</script>
