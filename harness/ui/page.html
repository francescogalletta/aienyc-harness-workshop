<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Advisor Harness</title>
<script>
/* Theme before first paint: follow the system setting. */
(function () {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function set() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); }
  set();
  if (mq.addEventListener) { mq.addEventListener('change', set); }
})();
</script>
<style>
/* Financial Advisor Harness: tokens. Compiled from tokens.json; edit that file, not this one. */
:root, [data-theme="light"] {
  --ground: #eef2f7;
  --surface: #ffffff;
  --ink: #0f2440;
  --ink-2: #33465f;
  --muted: #4f6078;
  --line: #bccadb;
  --flow: #6f84a0;
  --needs-you: #ffd9b0;
  --tested: #0b6b6a;
  --thread: #dde6f2;
  --bubble: #dfe6ef;
  --on-ink: #ffffff;
  --shadow-pop: 0 6px 20px rgba(15,36,64,0.16);
}
[data-theme="dark"] {
  --ground: #0c1524;
  --surface: #14213a;
  --ink: #e8eef7;
  --ink-2: #c3cfdf;
  --muted: #9db0c8;
  --line: #2e4466;
  --flow: #5f7898;
  --needs-you: #7a4a10;
  --tested: #5fd0c8;
  --thread: #1b2c4a;
  --bubble: #223556;
  --on-ink: #0c1524;
  --shadow-pop: 0 6px 20px rgba(0,0,0,0.5);
  color-scheme: dark;
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-step-you: 36px;
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 360ms;
  --dur-draw: 500ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
.fah-title { font-family: var(--font-sans); font-size: 22px; line-height: 28px; font-weight: 600; }
.fah-question { font-family: var(--font-sans); font-size: 16px; line-height: 22px; font-weight: 600; }
.fah-step-name { font-family: var(--font-sans); font-size: 15px; line-height: 20px; font-weight: 600; }
.fah-body { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 400; }
.fah-small { font-family: var(--font-sans); font-size: 13px; line-height: 18px; font-weight: 400; }
.fah-label { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; }
.fah-pill { font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 400; }
</style>
<style>
/* Financial Advisor Harness: component styles. Load tokens.css first.
   Every class is prefixed fah-. Wrap a screen in .fah once. No dependencies. */

.fah, .fah *, .fah *::before, .fah *::after { box-sizing: border-box; }
.fah {
  font-family: var(--font-sans, "IBM Plex Sans", "Segoe UI", system-ui, sans-serif);
  font-size: 14px; line-height: 20px; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.fah :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

@keyframes fah-rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fah-pop { from { opacity: 0; transform: scale(0.97) translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes fah-draw { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
@keyframes fah-flow { from { stroke-dashoffset: 10; } to { stroke-dashoffset: -100; } }
@keyframes fah-ring { from { box-shadow: 0 0 0 0 var(--needs-you); } to { box-shadow: 0 0 0 12px rgba(0, 0, 0, 0); } }
@keyframes fah-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

/* ---- Step ---- */
.fah-step {
  position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  width: 184px; min-height: 72px; padding: 8px 12px; margin: 0;
  font: inherit; text-align: left; color: var(--ink); background: var(--surface);
  border: 0; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1.5px var(--ink);
  cursor: pointer;
  transition: box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-base) var(--ease-out),
    color var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.fah-step:hover { transform: translateY(-1px); box-shadow: inset 0 0 0 1.5px var(--ink), var(--shadow-pop); }
.fah-step:active { transform: scale(0.99); }
.fah-step--from-you { border-radius: var(--radius-step-you); }
.fah-step--your-call { box-shadow: none; border: 1.5px dashed var(--ink); padding: 6.5px 10.5px; }
.fah-step--your-call:hover { box-shadow: var(--shadow-pop); }
.fah-step--selected, .fah-step--selected:hover { box-shadow: inset 0 0 0 3px var(--ink); }
.fah-step--your-call.fah-step--selected, .fah-step--your-call.fah-step--needs-you { box-shadow: none; border-width: 3px; padding: 5px 9px; }
.fah-step--needs-you { background: var(--needs-you); }
.fah-step--needs-you::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  animation: fah-ring 700ms var(--ease-out) 1 both;
}
.fah-step--faded { color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.fah-step--faded.fah-step--your-call { box-shadow: none; border-color: var(--line); }
.fah-step__name { font-size: 15px; line-height: 20px; font-weight: 600; }
.fah-step__line { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.fah-step--faded .fah-step__line { color: var(--muted); }
.fah-step__line--strong { font-weight: 600; color: var(--ink); }
.fah-step__line--result { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink); }
.fah-step__tick {
  display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px;
  fill: none; stroke: var(--tested); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 16; stroke-dashoffset: 0;
}
.fah-step.is-arriving .fah-step__line { animation: fah-rise var(--dur-slow) var(--ease-out) both; }
.fah-step.is-arriving .fah-step__tick { animation: fah-draw var(--dur-draw) var(--ease-out) both; }

/* ---- Pill (an input) ---- */
.fah-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.fah-pill {
  display: inline-flex; padding: 4px 8px; font-size: 11px; line-height: 14px; white-space: nowrap;
  color: var(--ink-2); background: var(--surface); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
}
.fah-pill--used { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* ---- Flow (a line or arrow between steps) ---- */
.fah-flow { display: block; overflow: visible; fill: none; stroke: var(--flow); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fah-flow__head { fill: var(--flow); stroke: none; }
.fah-flow__pulse { stroke: var(--ink); stroke-dasharray: 10 100; stroke-dashoffset: 10; opacity: 0; }
.fah-flow.is-flowing .fah-flow__pulse { opacity: 1; animation: fah-flow var(--dur-draw) var(--ease-in-out) both; }

/* ---- Button, Toggle ---- */
.fah-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; margin: 0;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: transparent;
  border: 0; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1.5px var(--ink); cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.fah-btn:hover { background: var(--bubble); }
.fah-btn:active { transform: scale(0.98); }
.fah-btn--primary, .fah-btn[aria-pressed="true"] { color: var(--on-ink); background: var(--ink); box-shadow: none; }
.fah-btn--primary:hover, .fah-btn[aria-pressed="true"]:hover { background: var(--ink-2); }
.fah-btn--block { display: flex; width: 100%; justify-content: flex-start; text-align: left; padding: 10px 12px; }
.fah-link { padding: 0; margin: 0; font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.fah-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---- Chat ---- */
.fah-chat { display: flex; flex-direction: column; gap: 14px; }
.fah-msg { margin: 0; animation: fah-rise var(--dur-base) var(--ease-out) both; }
.fah-msg--you { align-self: flex-end; max-width: 280px; padding: 10px 12px; background: var(--bubble); border-radius: 10px; }
.fah-chip { display: inline-block; padding: 0 6px; font-size: 12px; line-height: 16px; font-weight: 600; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1.5px var(--ink); }
.fah-msg--you .fah-chip { display: table; margin-bottom: 6px; }
.fah-num { padding: 0 1px; font-weight: 600; border-bottom: 2px solid var(--ink); border-radius: 2px 2px 0 0; cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
.fah-num:hover, .fah-num.is-traced { background: var(--thread); }
.fah-working { position: relative; width: 48px; height: 2px; overflow: hidden; background: var(--line); border-radius: 1px; }
.fah-working::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--ink); animation: fah-slide 1.1s var(--ease-in-out) infinite; }

/* ---- Thread (a side question or a reviewer challenge) ---- */
.fah-thread { font-size: 13px; line-height: 18px; background: var(--thread); border-radius: var(--radius-lg); }
.fah-thread > summary { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; font-weight: 600; cursor: pointer; list-style: none; border-radius: var(--radius-lg); }
.fah-thread > summary::-webkit-details-marker { display: none; }
.fah-thread > summary::before { content: "▸"; display: inline-block; transition: transform var(--dur-base) var(--ease-out); }
.fah-thread[open] > summary::before { transform: rotate(90deg); }
.fah-thread__meta { font-weight: 400; color: var(--ink-2); }
.fah-thread__body { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; font-size: 14px; line-height: 20px; }
.fah-thread[open] > .fah-thread__body { animation: fah-rise var(--dur-base) var(--ease-out) both; }
.fah-thread__source { font-size: 12px; color: var(--ink-2); }

/* ---- Decision (a call that is the person's) ---- */
.fah-decision { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 2px var(--ink); animation: fah-rise var(--dur-base) var(--ease-out) both; }
.fah-decision__q { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; }
.fah-decision__why { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-2); }

/* ---- Notice (something ran on an unconfirmed assumption) ---- */
.fah-notice { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1.5px dashed var(--flow); border-radius: var(--radius-lg); animation: fah-rise var(--dur-base) var(--ease-out) both; }

/* ---- Composer (the message box) ---- */
.fah-composer { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1.5px var(--ink); transition: box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-base) var(--ease-out); }
.fah-composer:focus-within { box-shadow: inset 0 0 0 2.5px var(--ink); }
.fah-composer--side { background: var(--thread); }
.fah-composer input { flex: 1; min-width: 0; padding: 0; font: inherit; color: var(--ink); background: transparent; border: 0; outline: 0; }
.fah-composer input::placeholder { color: var(--muted); opacity: 1; }
.fah-side { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0; font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; white-space: nowrap; }
.fah-side::after { content: ""; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--muted); transition: background-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
.fah-side[aria-pressed="true"] { color: var(--ink); }
.fah-side[aria-pressed="true"]::after { background: var(--ink); box-shadow: none; }

/* ---- Popover (a step's detail) ---- */
.fah-pop { display: flex; flex-direction: column; gap: 6px; width: 336px; padding: 14px 16px; font-size: 13px; line-height: 18px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1.5px var(--ink), var(--shadow-pop); transform-origin: top left; animation: fah-pop var(--dur-base) var(--ease-out) both; }
.fah-pop__head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; line-height: 20px; font-weight: 600; }
.fah-pop__row { display: flex; justify-content: space-between; gap: 12px; }
.fah-pop__row > :last-child { color: var(--muted); }
.fah-pop__row--you > :last-child { color: var(--ink); font-weight: 600; }
.fah-pop__foot { display: flex; gap: 16px; margin-top: 6px; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) {
  .fah *, .fah *::before, .fah *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
<style>
/* ---- The page: layout only. Every colour, size and timing comes from the design system's tokens. ---- */
.fah [hidden] { display: none !important; }
.fah a { color: inherit; }
button.fah-chip { margin: 0; border: 0; background: none; color: inherit; font-family: inherit; cursor: pointer; }
html, body { margin: 0; background: var(--ground); color: var(--ink); }
body { min-height: 100vh; }
.fa-app { --chat-w: clamp(320px, 23.5vw, 400px); display: grid; grid-template-columns: minmax(0, 1fr) var(--chat-w); height: 100vh; }
.fa-plan { position: relative; min-width: 0; overflow: auto; padding: 20px 20px 48px; }
.fa-side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); box-shadow: inset 1px 0 0 var(--line); }

.fa-top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.fa-head { min-width: 0; flex: 1 1 360px; }
.fa-product { margin: 0 0 6px; color: var(--muted); letter-spacing: 0; }
.fa-goal { margin: 0; max-width: 62ch; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.fa-goalmeta { margin: 4px 0 0; color: var(--muted); }
.fa-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: flex-end; }
.fa-tools .fah-working { width: 32px; }
.fah-btn[aria-disabled="true"] { cursor: default; }
.fah-btn[aria-disabled="true"]:hover { background: transparent; }
.fah-btn[aria-disabled="true"]:active { transform: none; }
.fa-building { display: inline-flex; align-items: center; gap: 10px; }

.fa-scroll { overflow-x: auto; overflow-y: visible; margin: 0 -20px; padding: 4px 20px 12px; }
.fa-canvas { position: relative; }
.fa-canvas .fah-step { position: absolute; height: 84px; min-height: 0; }
.fa-canvas .fah-step--from-you { padding-left: 20px; padding-right: 20px; }
.fa-canvas .fah-step--from-you.fah-step--selected, .fa-canvas .fah-step--from-you.fah-step--needs-you { padding-left: 20px; padding-right: 20px; }
.fa-canvas .fah-step__name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.fa-canvas .fah-step__line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fa-canvas .fah-pills { position: absolute; max-width: 184px; flex-wrap: nowrap; overflow: hidden; }
.fa-canvas .fah-pills .fah-pill { flex: none; }
.fa-canvas .fah-pills .fah-pill:only-child { display: block; max-width: 184px; overflow: hidden; text-overflow: ellipsis; }
.fa-canvas .fah-flow { position: absolute; }
.fa-tag { position: absolute; top: calc(100% + 3px); right: 2px; font-size: 11px; line-height: 14px; font-weight: 400; color: var(--muted); white-space: nowrap; pointer-events: none; }
.fa-tag > span + span { margin-left: 8px; }
.fa-canvas .fah-pop { position: absolute; z-index: 5; max-height: min(70vh, 520px); overflow: auto; }

.fa-empty { max-width: 46ch; margin: 48px 0; color: var(--ink-2); }
.fa-empty p { margin: 0 0 8px; }

/* Pop-up contents */
.fa-sec-h { margin: 8px 0 0; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-2); }
.fa-p { margin: 0; }
.fa-quiet { color: var(--muted); }
.fa-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.fa-list li { display: block; }
.fa-sub { display: block; font-size: 12px; line-height: 16px; color: var(--muted); }
.fa-orig { margin-left: 6px; font-size: 12px; color: var(--muted); }
.fa-orig a, .fa-src a { color: inherit; }
.fa-receipt { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: var(--ground); border-radius: var(--radius-sm); }
.fa-receipt .fah-pop__row > :last-child { color: var(--ink); }
.fa-receipt__out { padding-top: 4px; box-shadow: inset 0 1px 0 var(--line); font-weight: 600; }
.fa-code { margin: 0; max-height: 240px; overflow: auto; padding: 8px 10px; font-size: 12px; line-height: 16px; background: var(--ground); border-radius: var(--radius-sm); white-space: pre; }
.fa-acts { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.fa-ex { display: flex; flex-direction: column; gap: 2px; }
.fa-ex .fa-sub .fah-link { margin-left: 8px; font-size: 12px; color: var(--ink); }
.fah-pop .fah-row .fah-btn { min-height: 36px; padding: 0 12px; }

/* Whole plan and the Review list */
.fa-section { max-width: 760px; margin-top: 28px; padding-top: 16px; box-shadow: inset 0 1px 0 var(--line); }
.fa-section__head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 0 0 4px; }
.fa-section h3 { margin: 16px 0 6px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-2); }
.fa-section ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.fa-rv { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 0; box-shadow: inset 0 -1px 0 var(--line); }
.fa-rv__text { flex: 1 1 260px; min-width: 0; }
.fa-rv .fah-btn { min-height: 36px; padding: 0 12px; }

/* Chat */
.fa-log { flex: 1; min-height: 0; overflow: auto; padding: 20px 16px 12px; }
.fa-log > .fah-chat + .fah-chat { margin-top: 14px; }
.fa-log .fah-msg--you { max-width: 88%; }
.fa-noanim, .fa-noanim > .fah-thread__body { animation: none !important; }
.fa-muted { color: var(--ink-2); }
.fa-meta { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
.fa-working { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.fa-tmsg { margin: 0; }
.fa-tmsg--you { padding-left: 12px; box-shadow: inset 2px 0 0 var(--flow); }
.fa-tmsg__who { font-weight: 600; }
.fah-thread .fah-row .fah-btn { min-height: 36px; padding: 0 12px; }
.fa-compose { padding: 8px 16px 16px; background: var(--surface); }
.fa-compose .fah-composer { flex-wrap: wrap; row-gap: 4px; }
.fa-compose .fah-composer input { flex: 1 1 170px; min-height: 32px; }
.fa-chiprow { flex: 1 0 100%; min-width: 0; padding-top: 4px; }
.fa-chiprow .fah-chip { max-width: 100%; }
.fa-hint { margin: 0 0 6px; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.fa-hint:empty { display: none; }
.fah-composer .fah-chip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fa-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 820px) {
  .fa-app { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
  .fa-side { flex: 1 0 auto; }
  .fa-plan { overflow: visible; padding: 16px 16px 24px; }
  .fa-scroll { margin: 0 -16px; padding: 4px 16px 12px; }
  .fa-side { box-shadow: inset 0 1px 0 var(--line); padding-bottom: 96px; }
  .fa-log { overflow: visible; padding: 16px; }
  .fa-compose { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -1px 0 var(--line); }
  .fa-tools { justify-content: flex-start; }
  .fa-canvas .fah-pop { max-width: calc(100vw - 32px); }
}
</style>
</head>
<body>
<div class="fah fa-app" id="app">
  <main class="fa-plan" id="plan" aria-label="The plan">
    <div class="fa-top">
      <div class="fa-head">
        <p class="fah-label fa-product">Financial Advisor Harness</p>
        <h1 class="fah-title fa-goal" id="goal" hidden></h1>
        <p class="fah-small fa-goalmeta" id="goalmeta" hidden></p>

    var acts = arr(S.activity);
    var running = acts.some(function (a) { return a.what === 'build'; }) || calc.some(function (s) { return s.build.status === 'building'; });
    var built = calc.filter(function (s) { return s.build.status === 'built'; }).length;
    var todo = calc.filter(function (s) { return ['none', 'not_built', 'stale'].indexOf(s.build.status) >= 0; });
    var b = el('button', 'fah-btn'); b.type = 'button'; b.id = 'build';
    if (running) {
      var a = acts.filter(function (x) { return x.what === 'build'; })[0];
      var at = a && a.step ? stepById(a.step) : null;
      var span = el('span', 'fa-building');
      var wk = el('span', 'fah-working'); wk.setAttribute('aria-hidden', 'true');
      add(span, wk, 'Building ' + Math.min(built + 1, calc.length) + ' of ' + calc.length);
      b.appendChild(span); b.setAttribute('aria-disabled', 'true');
      b.title = at ? label(at) + (a.text ? ': ' + a.text : '') : (a && a.text) || '';
    } else if (!todo.length) {
      b.textContent = 'All ' + calc.length + ' built'; b.setAttribute('aria-disabled', 'true');
    } else {
      b.classList.add('fah-btn--primary');
      var fresh = todo.every(function (s) { return s.build.status === 'none'; });
      b.textContent = built === 0 && fresh ? 'Build the calculations' : (fresh ? 'Build ' + todo.length + ' more' : 'Rebuild ' + todo.length + (todo.length === 1 ? ' step' : ' steps'));
      b.addEventListener('click', function () { b.setAttribute('aria-disabled', 'true'); act('build'); });
    }
    return b;
  }

  /* ---------- whole-plan context (off screen until asked for) ---------- */
  function itemLi(it, extra) {
    var li = add(el('li'), it.text || it.what || it.term || '');
    var m = originMark(it.origin); if (m) { li.appendChild(m); }
    if (extra) { li.appendChild(el('span', 'fa-sub', extra)); }
    return li;
  }
  function drawWhole() {
    var w = $('whole');
    var link = document.querySelector('#tools .fah-link'); if (link) { link.setAttribute('aria-expanded', String(ui.whole)); }
    show(w, !!(ui.whole && S.context)); w.textContent = '';
    if (!ui.whole || !S.context) { return; }
    var c = S.context;
    var head = el('div', 'fa-section__head');
    add(head, el('h2', 'fah-question', 'Whole plan'), linkBtn('Close', function () { ui.whole = false; drawWhole(); }));
    w.appendChild(head);
    if (S.goal && S.goal.text) { w.appendChild(add(el('p', 'fa-p'), S.goal.text, originMark(S.goal.origin))); }
    function part(title, items, fn) {
      if (!arr(items).length) { return; }
      w.appendChild(el('h3', null, title));
      var ul = el('ul'); items.forEach(function (it) { ul.appendChild(fn ? fn(it) : itemLi(it)); }); w.appendChild(ul);
    }
    part('In scope', c.scope_in);
    part('Not in scope', c.scope_out);
    part('Assumptions', c.assumptions, function (it) { return itemLi(it, it.handling); });
    part('Done when', c.done);
    part('Open questions', c.open_questions, function (it) { return itemLi({ text: '● ' + (it.text || ''), origin: it.origin }); });
    part('Terms', c.glossary, function (g) {
      var li = add(el('li'), el('b', null, g.term || ''), ': ' + (g.definition || ''));
      var m = originMark(g.origin); if (m) { li.appendChild(m); }
      if (g.person_says) { li.appendChild(el('span', 'fa-sub', 'You say “' + g.person_says + '”')); }
      return li;
    });
    part('Changes', c.revisions, function (r) {
      var s = r.step ? stepById(r.step) : null;
      return add(el('li'), (r.by === 'reviewer' ? 'From the reviewer' : 'You') + (s ? ', on ' + label(s) : '') + ': “' + (r.words || '') + '”', el('span', 'fa-sub', when(r.ts)));
    });
  }

  /* ---------- Review view: one line per challenged step ---------- */
  function drawReviewList() {
    var box = $('reviewlist'); box.textContent = '';
    var on = ui.review && hasReview() && S.phase === 'accepted';
    show(box, on); if (!on) { return; }
    var head = el('div', 'fa-section__head'); head.appendChild(el('h2', 'fah-question', 'Review'));
    box.appendChild(head);
    var any = false;
    steps().forEach(function (s) {
      openChallenges(s).forEach(function (t) {
        any = true;
        var row = challengeBlock(t, false);
        var chip = linkBtn(label(s), function () { clickStep(s.id); });
        chip.className = 'fah-chip'; chip.style.marginRight = '8px';
        row.firstChild.insertBefore(chip, row.firstChild.firstChild);
        box.appendChild(row);
      });
    });
    if (!any) { box.appendChild(el('p', 'fa-p fa-quiet', S.review.running ? 'The reviewer is looking at the plan.' : 'Nothing is challenged.')); }
  }

  /* ================= the chat ================= */
  function withFigures(p, m) {
    var text = String(m.text || ''), figs = arr(m.figures).filter(function (f) { return f && f.step && stepById(f.step); }), pos = 0, spans = [];
    figs.forEach(function (f) {
      var s = f.start, e = f.end;
      if (!(typeof s === 'number' && typeof e === 'number' && text.slice(s, e) === f.text)) { s = text.indexOf(f.text, pos); e = s + String(f.text).length; }
      if (s >= 0) { spans.push([s, e, f]); }
    });
    spans.sort(function (a, b) { return a[0] - b[0]; });
    spans.forEach(function (sp) {
      if (sp[0] < pos) { return; }
      p.appendChild(document.createTextNode(text.slice(pos, sp[0])));
      var n = el('span', 'fah-num', text.slice(sp[0], sp[1])), sid = sp[2].step;
      n.tabIndex = 0; n.setAttribute('role', 'button');
      n.setAttribute('aria-label', text.slice(sp[0], sp[1]) + ', from step ' + label(stepById(sid)));
      function go(ev) { ev.preventDefault(); ev.stopPropagation(); ui.selected = sid; F.trace(n, stepEls[sid] || null, document); }
      n.addEventListener('click', go);
      n.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { go(ev); } });
      p.appendChild(n); pos = sp[1];
    });
    p.appendChild(document.createTextNode(text.slice(pos)));
    return p;
  }
  function chip(stepId) { var s = stepById(stepId); return s ? el('span', 'fah-chip', label(s)) : null; }

  function openNoticeFor(stepId) {
    var c = arr(S.chat);
    for (var i = c.length - 1; i >= 0; i--) { var n = c[i].notice; if (n && n.status === 'open' && arr(n.steps).indexOf(stepId) >= 0) { return c[i]; } }
    return null;
  }
  function changeIt(m) {
    ui.notice = m.id; ui.attached = arr(m.notice.steps)[0] || null; ui.thread = null; setSide(false);
    drawComposer(); input.focus();
  }

  function messageNode(m, ctx) {
    var wrap = document.createDocumentFragment(), nodes = [];
    var kind = m.kind || 'text';
    if (kind === 'decision' && m.decision) {
      var d = m.decision;
      if (d.status === 'open') {
        var box = el('div', 'fah-decision'); box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Your call');
        var c = chip(d.step || m.step); if (c) { box.appendChild(add(el('div'), c)); }
        box.appendChild(el('p', 'fah-decision__q', d.question || m.text || ''));
        arr(d.options).forEach(function (o, i) {
          var sug = d.suggested === i + 1;
          var b = btn(o + (sug ? ' · suggested' : ''), function () { act('choose', { decision: d.id, option: i + 1 }); }, sug);
          b.classList.add('fah-btn--block'); box.appendChild(b);
        });
        if (d.why) { box.appendChild(el('p', 'fah-decision__why', d.why)); }
        nodes.push(box);
      } else if (!ctx.nextIsYou) {
        var n = parseInt(d.choice, 10), opt = !isNaN(n) && d.options ? d.options[n - 1] : null;
        var p = el('p', 'fah-msg fah-msg--you'); var cc = chip(d.step || m.step); if (cc) { p.appendChild(cc); }
        add(p, opt || 'Something else'); nodes.push(p);
      }
    } else if (m.who === 'you') {
      var py = el('p', 'fah-msg fah-msg--you'); var c2 = chip(m.step); if (c2) { py.appendChild(c2); }
      add(py, m.text || '');
      if (m.queued) { py.appendChild(el('span', 'fa-meta', 'Waiting its turn')); }
      nodes.push(py);
    } else {
      var pa = withFigures(el('p', 'fah-msg' + (kind === 'withheld' || m.who === 'harness' ? ' fa-muted' : '')), m);
      if (m.step && m.who !== 'you') { var c3 = chip(m.step); if (c3) { pa.insertBefore(el('br'), pa.firstChild); pa.insertBefore(c3, pa.firstChild); } }
      nodes.push(pa);
      if (kind === 'plan' && ctx.acceptHere) {
        nodes.push(add(el('div', 'fah-row'), btn('Accept plan', function (b) { b.setAttribute('aria-disabled', 'true'); act('accept_plan'); }, true)));
      }
    }
    if (m.notice && m.notice.status === 'open') {
      var nt = el('div', 'fah-notice'), as = arr(m.notice.assumptions);
      if (as.length === 1) { nt.appendChild(el('div', null, '◌ This rests on one thing you haven\'t confirmed: ' + lower(as[0].text))); }
      else {
        nt.appendChild(el('div', null, '◌ This rests on ' + as.length + ' things you haven\'t confirmed:'));
        var ul = el('ul', 'fa-list'); as.forEach(function (a) { ul.appendChild(el('li', null, a.text)); }); nt.appendChild(ul);
      }
      nt.appendChild(add(el('div', 'fah-row'),
        btn('Confirm', function () { act('confirm_assumptions', { message: m.id }); }, true),
        btn('Change it', function () { changeIt(m); })));
      nodes.push(nt);
    }
    nodes.forEach(function (n) { wrap.appendChild(n); });
    return nodes;
  }
  function lower(t) { t = String(t || ''); return t && /^[A-Z][a-z]/.test(t) ? t.charAt(0).toLowerCase() + t.slice(1) : t; }

  function nearBottom() { var l = $('log'); return l.scrollHeight - l.scrollTop - l.clientHeight < 80; }
  function toBottom() { var l = $('log'); if (l.scrollHeight > l.clientHeight) { l.scrollTop = l.scrollHeight; } }

  function drawChat() {
    var stick = first || nearBottom();
    var chat = arr(S.chat), box = $('msgs');
    var lastPlan = -1; chat.forEach(function (m, i) { if (m.kind === 'plan') { lastPlan = i; } });
    var waitingPlan = S.waiting && S.waiting.kind === 'plan';
    var live = {}, prev = null;
    chat.forEach(function (m, i) {
      var ctx = { acceptHere: i === lastPlan && waitingPlan, nextIsYou: !!(chat[i + 1] && chat[i + 1].who === 'you') };
      var key = m.id || ('i' + i);
      var sig = JSON.stringify([m, ctx, (m.figures || []).map(function (f) { return f.step && !!stepById(f.step); }), m.step ? label(stepById(m.step)) : '']);
      live[key] = true;
      var rec = msgEls[key];
      if (!rec || rec.sig !== sig) {
        var nodes = messageNode(m, ctx);
        if (rec) { nodes.forEach(function (n) { n.classList.add('fa-noanim'); }); rec.nodes.forEach(function (n, j) { if (j === 0) { return; } n.remove(); }); }
        var anchor = rec ? rec.nodes[0] : null;
        var holder = el('div'); holder.style.display = 'contents'; nodes.forEach(function (n) { holder.appendChild(n); });
        if (first) { nodes.forEach(function (n) { n.classList.add('fa-noanim'); }); }
        if (anchor) { anchor.replaceWith(holder); } else { insertAfter(box, holder, prev); }
        rec = msgEls[key] = { sig: sig, nodes: [holder] };
      }
      prev = rec.nodes[0];
      if (prev.parentNode !== box) { box.appendChild(prev); }
    });
    Object.keys(msgEls).forEach(function (k) { if (!live[k]) { msgEls[k].nodes.forEach(function (n) { n.remove(); }); delete msgEls[k]; } });

    drawThreads();
    drawTail();
    if (stick) { toBottom(); }
  }
  function insertAfter(parent, node, prev) {
    if (prev && prev.parentNode === parent) { parent.insertBefore(node, prev.nextSibling); } else { parent.insertBefore(node, parent.firstChild); }
  }

  function drawThreads() {
    var box = $('threads'), list = threads();
    show(box, !!(list && list.length));
    if (!list) { return; }
    if (ui.knownThreads && ui.wantNewThread) {
      list.forEach(function (t) { if (t.kind === 'side' && !ui.knownThreads[t.id]) { ui.openThread = t.id; ui.wantNewThread = false; } });
    }
    ui.knownThreads = {}; list.forEach(function (t) { ui.knownThreads[t.id] = true; });
    var sideWorking = S.lanes && S.lanes.side === 'working';
    var workingIn = null;
    if (sideWorking) {
      list.forEach(function (t) { var ms = arr(t.messages); if (ms.length && ms[ms.length - 1].who === 'you') { workingIn = t.id; } });
    }
    var live = {};
    list.forEach(function (t) {
      live[t.id] = true;
      var sig = JSON.stringify([t, workingIn === t.id, t.step ? label(stepById(t.step)) : '']);
      var rec = thrEls[t.id];
      if (!rec || rec.sig !== sig) {
        var d = threadNode(t, workingIn === t.id);
        if (rec) { d.classList.add('fa-noanim'); rec.node.replaceWith(d); }
        thrEls[t.id] = rec = { sig: sig, node: d };
      }
      rec.node.open = ui.openThread === t.id;
      box.appendChild(rec.node);
    });
    Object.keys(thrEls).forEach(function (k) { if (!live[k]) { thrEls[k].node.remove(); delete thrEls[k]; } });
  }
  function threadNode(t, working) {
    var d = el('details', 'fah-thread'); d.setAttribute('name', 'fa-threads'); d.id = 'thread-' + t.id;
    var s = t.step ? stepById(t.step) : null;
    var sum = el('summary', null, t.kind === 'review' ? 'Reviewer' : 'Side question');
    var about = t.kind === 'review' ? (s ? label(s) : t.title) : (t.title || (s ? label(s) : ''));
    var meta = el('span', 'fah-thread__meta', '· ' + (about || '') + (t.status === 'used' ? ' · used' : t.status === 'dismissed' ? ' · dismissed' : ''));
    sum.appendChild(meta);
    d.appendChild(sum);
    var body = el('div', 'fah-thread__body');
    if (t.kind === 'review' && t.title) { body.appendChild(el('p', 'fa-tmsg', null)).appendChild(el('b', null, t.title)); }
    arr(t.messages).forEach(function (m) {
      var p = el('p', 'fa-tmsg' + (m.who === 'you' ? ' fa-tmsg--you' : ''));
      if (m.who === 'you') { p.appendChild(el('span', 'fa-tmsg__who', 'You: ')); }
      add(p, m.text || '');
      var srcs = arr(m.sources).filter(function (x) { return x && safeUrl(x.url); });
      if (srcs.length) {
        var sp = el('span', 'fah-thread__source fa-src'); add(sp, ' ');
        srcs.forEach(function (x, i) { if (i) { add(sp, ', '); } add(sp, '↗ ', link(x.title || x.url, x.url)); });
        p.appendChild(sp);
      }
      body.appendChild(p);
    });
    if (working) {
      var w = el('div', 'fa-working'); var bar = el('div', 'fah-working'); bar.setAttribute('role', 'status'); bar.setAttribute('aria-label', 'Answering on the side');
      add(w, bar, 'Answering on the side'); body.appendChild(w);
    }
    var c = t.challenge;
    if (c && c.status === 'open') {
      var row = el('div', 'fah-row');
      if (c.kind !== 'question') { row.appendChild(btn('Use this', function () { act('use_challenge', { challenge: c.id }); }, true)); }
      row.appendChild(btn('Dismiss', function () { act('dismiss_challenge', { challenge: c.id }); }));
      body.appendChild(row);
    }
    if (t.status === 'open') { body.appendChild(add(el('div'), linkBtn('Reply on the side', function () { replyIn(t); }))); }
    d.appendChild(body);
    d.addEventListener('toggle', function () { if (d.open) { ui.openThread = t.id; } else if (ui.openThread === t.id) { ui.openThread = null; } });
    return d;
  }
  function openThread(id) {
    ui.openThread = id; drawThreads();
    var n = $('thread-' + id); if (n) { n.open = true; n.scrollIntoView({ block: 'nearest', behavior: reduced.matches ? 'auto' : 'smooth' }); var s = n.querySelector('summary'); if (s) { s.focus({ preventScroll: true }); } }
  }
  function replyIn(t) { ui.thread = t.id; ui.attached = null; ui.notice = null; setSide(true); drawComposer(); input.focus(); }

  function drawTail() {
    var tail = $('tail'); tail.textContent = '';
    var main = S.lanes && S.lanes.main;
    if (main === 'working') {
      var a = arr(S.activity).filter(function (x) { return x.lane === 'main'; })[0];
      var s = a && a.step ? stepById(a.step) : null;
      var w = el('div', 'fa-working'), bar = el('div', 'fah-working');
      var text = (s ? label(s) + ': ' : '') + ((a && a.text) || 'Working');
      bar.setAttribute('role', 'status'); bar.setAttribute('aria-label', text);
      add(w, bar, text); tail.appendChild(w);
    }
    if (S.phase === 'interview' && S.waiting && S.waiting.kind === 'message') {
      tail.appendChild(add(el('div'), linkBtn('Propose the plan now', function () { act('wrap'); })));
    }
    if (S.error) { tail.appendChild(el('p', 'fah-msg fa-muted fa-noanim', 'That did not finish: ' + S.error)); }
    show(tail, tail.childNodes.length > 0);
  }

  /* ---------- the composer ---------- */
  function setSide(on) {
    ui.side = !!on;
    sideBtn.setAttribute('aria-pressed', String(ui.side));
    composer.classList.toggle('fah-composer--side', ui.side);
  }
  function drawComposer() {
    var canSide = !!threads();
    show(sideBtn, canSide);
    if (!canSide && ui.side) { setSide(false); }
    var old = composer.querySelector('.fa-chiprow'); if (old) { old.remove(); }
    var text = null, aria = '';
    var t = ui.thread ? arr(threads()).filter(function (x) { return x.id === ui.thread; })[0] : null;
    if (ui.thread && !t) { ui.thread = null; }
    if (t) { text = 'Reply: ' + (t.title || 'side question'); aria = 'Stop replying in this thread'; }
    else if (ui.attached && stepById(ui.attached)) { text = label(stepById(ui.attached)); aria = 'Remove step ' + text; }
    else { ui.attached = null; ui.notice = null; }
    if (text) {
      var c = el('button', 'fah-chip', text + ' ✕'); c.type = 'button'; c.setAttribute('aria-label', aria);
      c.addEventListener('click', function () { if (ui.thread) { ui.thread = null; setSide(false); } ui.attached = null; ui.notice = null; drawComposer(); input.focus(); });
      composer.insertBefore(add(el('div', 'fa-chiprow'), c), input);
    }
    composer.classList.toggle('fa-has-chip', !!text);
    var ph, decisionOpen = S && S.waiting && S.waiting.kind === 'decision';
    if (ui.thread) { ph = 'Reply on the side…'; }
    else if (ui.notice) { ph = 'Say what is different…'; }
    else if (ui.side) { ph = 'Ask on the side, nothing changes…'; }
    else if (decisionOpen) { ph = '…or answer in your own words'; }
    else if (ui.attached) { ph = 'Say what should change…'; }
    else if (!S || S.phase === 'empty' || !steps().length) { ph = S && S.phase === 'interview' ? 'Answer, or add anything…' : 'Say what you want to plan…'; }
    else { ph = 'Ask, or click a step…'; }
    input.placeholder = ph;
    input.setAttribute('aria-label', ui.thread ? 'Reply on the side' : ui.attached ? 'Message about step ' + label(stepById(ui.attached)) : 'Message');
  }
  function send() {
    var text = input.value.trim(); if (!text) { return; }
    var p;
    if (ui.thread) { p = act('side', { text: text, thread: ui.thread }); }
    else if (ui.side) {
      var body = { text: text }; if (ui.attached) { body.step = ui.attached; }
      ui.wantNewThread = true; p = act('side', body);
    } else {
      var b2 = { text: text }; if (ui.attached) { b2.step = ui.attached; } if (ui.notice) { b2.notice = ui.notice; }
      p = act('say', b2);
    }
    input.value = '';
    p.then(function (ok) {
      if (!ok) { if (!input.value) { input.value = text; } return; }
      ui.attached = null; ui.notice = null; ui.thread = null; setSide(false); drawComposer();
    });
  }
  input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); send(); } });
  sideBtn.addEventListener('click', function () { var on = F.sideToggle(sideBtn); ui.side = on; if (!on) { ui.thread = null; } drawComposer(); input.focus(); });

  /* ---------- empty plan ---------- */
  function drawEmpty() {
    var e = $('empty'), none = !steps().length;
    show(e, none); show(scroller, !none); e.textContent = '';
    if (!none) { return; }
    if (S.phase === 'interview') { e.appendChild(el('p', null, 'The assistant is asking what it needs. The plan appears here as steps once it has enough.')); }
    else if (S.phase === 'proposed' || S.phase === 'accepted') { e.appendChild(el('p', null, 'The plan has no steps yet.')); }
    else { e.appendChild(el('p', null, 'Say in the chat what you want to plan. The plan appears here as steps you can check, build and ask about.')); }
  }

  /* ---------- one draw from the state document ---------- */
  function draw() {
    try {
      drawTop();
      drawEmpty();
      drawDiagram();
      drawWhole();
      drawReviewList();
      drawChat();
      drawComposer();
      if (ui.pop) { refreshPop(); }
      if (first) {
        var ny = steps().filter(function (s) { return s.needs_you; })[0];
        if (ny && stepEls[ny.id]) { scroller.scrollLeft = Math.max(0, lay.pos[ny.id].x - 40); }
      }
    } catch (err) {
      if (window.console) { console.error(err); }
    }
    first = false;
  }

  /* ---------- page-level keys and clicks ---------- */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && ui.pop) { ev.preventDefault(); closePop(true); }
  });
  document.addEventListener('click', function (ev) {
    if (ui.pop && popEl && !popEl.contains(ev.target)) { closePop(false); }
  });
  var resizeTimer = null;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (S) { drawDiagram(); placePop(); } }, 120); });

  drawComposer();
  poll();
})();
</script>
</body>
